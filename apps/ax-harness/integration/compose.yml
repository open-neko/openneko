# Isolated qualification only. HARNESS_STATE must be an absolute host-shared path.
services:
  certgen:
    image: ghcr.io/nvidia/openshell/gateway:${HARNESS_OPENSHELL_VERSION:-0.1.2}
    command: [generate-certs, --output-dir, "${HARNESS_STATE:?}/pki", --server-san, openshell-gateway, --server-san, host.openshell.internal, --server-san, localhost, --server-san, 127.0.0.1]
    volumes:
      - ${HARNESS_STATE}:${HARNESS_STATE}
  openshell-gateway:
    image: ghcr.io/nvidia/openshell/gateway:${HARNESS_OPENSHELL_VERSION:-0.1.2}
    user: "0:0"
    command: [--config, "${HARNESS_STATE}/gateway.toml", --bind-address, 0.0.0.0, --port, "18116", --name, harness-m2]
    environment:
      OPENSHELL_DRIVERS: docker
      OTEL_BSP_SCHEDULE_DELAY: "100"
      OPENSHELL_LOCAL_TLS_DIR: ${HARNESS_STATE}/pki
      XDG_DATA_HOME: ${HARNESS_STATE}/data
      XDG_STATE_HOME: ${HARNESS_STATE}/state
      HOME: ${HARNESS_STATE}/home
    ports: ["127.0.0.1:18116:18116"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HARNESS_STATE}:${HARNESS_STATE}
    networks:
      default:
        ipv4_address: 172.30.116.2
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0@sha256:789689988e379c58ac12b07718dbcf4b23c2214bd804173c1c77af346d381c15
    user: "0:0"
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
      - ${HARNESS_STATE}/telemetry:/evidence
    networks:
      default:
        ipv4_address: 172.30.116.4
  oauth-fixture:
    image: harness-m2:local
    command: [/usr/local/bin/harness-probe, -oauth-serve]
    network_mode: service:openshell-gateway
  model-fixture:
    image: harness-m2:local
    command: [/usr/local/bin/harness-probe, -serve]
    ports: ["127.0.0.1:18080:8080", "127.0.0.1:18443:8443"]
    volumes:
      - ${HARNESS_STATE}/tls/fixture.crt:/tls/fixture.crt:ro
      - ${HARNESS_STATE}/tls/fixture.key:/tls/fixture.key:ro
    networks:
      default:
        ipv4_address: 172.30.116.3
networks:
  default:
    name: harness-m2
    ipam:
      config: [{subnet: 172.30.116.0/24}]
