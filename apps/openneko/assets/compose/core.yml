# Embedded core compose. The `openneko` binary materializes this and overlays
# dev.yml / demo.yml depending on `openneko start --mode`. Image tags are
# pinned to the binary's release version via the ${OPENNEKO_VERSION} env var
# (set by the supervisor before invoking docker compose). Operators who want
# to build from source should use the repo-root compose.yml instead.
x-neko-app-env: &neko-app-env
  HOME: /tmp/openneko-home
  TMPDIR: /tmp/openneko-tmp
  XDG_CONFIG_HOME: /config
  XDG_CACHE_HOME: /tmp/openneko-home/.cache
  XDG_DATA_HOME: /tmp/openneko-home/.local/share
  XDG_STATE_HOME: /tmp/openneko-home/.local/state
  NEKO_PG_HOST: neko-db
  NEKO_PG_PORT: "5432"
  NEKO_PG_USER: neko
  NEKO_PG_PASSWORD: secret
  NEKO_PG_DATABASE: neko
  OPENNEKO_SERVE_URL: http://openneko-serve:8090
  NEKO_EMBEDDING_URL: ${NEKO_EMBEDDING_URL:-}
  NEKO_EMBEDDING_MODEL: ${NEKO_EMBEDDING_MODEL:-}
  NEKO_EMBEDDING_API_KEY: ${NEKO_EMBEDDING_API_KEY:-}
  NEKO_EMBEDDING_DIMENSIONS: ${NEKO_EMBEDDING_DIMENSIONS:-}
  NO_PROXY: localhost,127.0.0.1,::1,neko-db,worker,web,graphjin,openneko-serve,adventureworks-db,host.docker.internal,host.internal
  no_proxy: localhost,127.0.0.1,::1,neko-db,worker,web,graphjin,openneko-serve,adventureworks-db,host.docker.internal,host.internal

services:
  neko-db:
    image: ghcr.io/open-neko/neko-db:${OPENNEKO_VERSION:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: neko
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: neko
      PGDATA: /var/lib/postgresql/neko
    expose:
      - "5432"
    volumes:
      - neko-db-data:/var/lib/postgresql/neko
      - neko-db-socket:/var/run/postgresql
    command:
      - postgres
      - -c
      - wal_compression=on
      - -c
      - temp_file_limit=5GB
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U neko -d neko
      interval: 5s
      timeout: 5s
      retries: 20

  # Start steps. Services in the "steps" profile are not part of `up`.
  # `openneko start`, `upgrade` and `restore` run them in this order with
  # `compose run --rm` and stop at the first failure. From a source checkout,
  # `docker compose run --rm openneko-serve-init` runs the whole chain.
  #
  # Storage ABI gate: repairs persisted indexes after a libc/collation
  # change, so an incompatible image fails closed before any read or write.
  storage-reconcile:
    profiles: ["steps"]
    image: ghcr.io/open-neko/neko-cli:${OPENNEKO_VERSION:-latest}
    restart: "no"
    command: ["storage", "reconcile"]
    depends_on:
      neko-db:
        condition: service_healthy
    environment:
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
      XDG_CONFIG_HOME: /config
    volumes:
      - openneko-config:/config/openneko






  # Applies SQL migrations after the storage gate.
  neko-migrate:
    profiles: ["steps"]
    image: ghcr.io/open-neko/neko-cli:${OPENNEKO_VERSION:-latest}
    restart: "no"
    command: ["migrate"]
    depends_on:
      neko-db:
        condition: service_healthy
      storage-reconcile:
        condition: service_completed_successfully
    # NEKO_PG_PASSWORD here is the bootstrap fallback only — once /setup
    # rotates the password the openneko CLI's defaultConn reads it from
    # /config/openneko/config.json on the shared volume. Without this volume
    # mount, re-`compose up` after rotation would fail with stale creds.
    environment:
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
      OPENNEKO_SKIP_MIGRATE: ${OPENNEKO_SKIP_MIGRATE:-}
      XDG_CONFIG_HOME: /config
    volumes:
      - openneko-config:/config/openneko

  # The migration CLI runs as root and may create the shared config directory
  # and secret key on first boot. Repair ownership before the non-root worker
  # mounts the volume so a completely fresh Compose project can start.
  openneko-config-init:
    profiles: ["steps"]
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /config/openneko
        chown -R 1001:1001 /config/openneko
        chmod 0700 /config/openneko
    depends_on:
      neko-migrate:
        condition: service_completed_successfully
    volumes:
      - openneko-config:/config/openneko
    restart: "no"

  # Sets the neko_files and neko_subscriptions role passwords,
  # writes serve's credentials
  # and creates the customer GraphJin config from the image's seed when it is
  # missing. Serve holds no main database login and no secret-key.
  openneko-serve-init:
    profiles: ["steps"]
    image: ghcr.io/open-neko/neko-serve:${OPENNEKO_VERSION:-latest}
    command: ["serve-init", "--dir", "/credentials"]
    depends_on:
      neko-migrate:
        condition: service_completed_successfully
      openneko-config-init:
        condition: service_completed_successfully
    environment:
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
      XDG_CONFIG_HOME: /config
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
    volumes:
      - openneko-config:/config/openneko
      - openneko-serve-credentials:/credentials
      - openneko-graphjin-cli:/config/graphjin
    restart: "no"

  # openneko serve: each user's private files, their keyword index in
  # neko-db, SQL over sheet tables, agent turns, the customer GraphJin on
  # 8080 and the subscriptions GraphJin on 8089 (workflow outputs, read as
  # neko_subscriptions).
  # Web and worker call it with short-lived tokens signed with a key derived
  # from the secret-key. GraphJin does not reload auth keys, so the start
  # steps write the per-org JWT secret before serve starts.
  openneko-serve:
    image: ghcr.io/open-neko/neko-serve:${OPENNEKO_VERSION:-latest}
    command: ["serve"]
    depends_on:
      neko-db:
        condition: service_healthy
    networks:
      default:
        aliases: [graphjin]
    expose:
      - "8080"
      - "8089"
    environment:
      OPENNEKO_SERVE_CREDENTIALS: /credentials
      OPENNEKO_SERVE_ADDR: 0.0.0.0:8090
      OPENNEKO_FILES_DIR: /data/files
      OPENNEKO_FILES_INDEX_DIR: /data/file-index
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      OPENNEKO_SANDBOX_URL: ${OPENNEKO_SANDBOX_URL:-}
      OPENNEKO_SANDBOX_KEY: ${OPENNEKO_SANDBOX_KEY:-}
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      OPENNEKO_GRAPHJIN_ADDR: 0.0.0.0:8080
      OPENNEKO_SUBSCRIPTIONS_ADDR: 0.0.0.0:8089
    volumes:
      - openneko-agent-runs:/var/lib/openneko/agent-runs
      - openneko-run:/run/openneko
      - openneko-serve-credentials:/credentials:ro
      - openneko-files:/data
      - openneko-graphjin-cli:/config/graphjin
    restart: unless-stopped

  web:
    image: ghcr.io/open-neko/neko-web:${OPENNEKO_VERSION:-latest}
    depends_on:
      openneko-serve:
        condition: service_started
      # Web is the user-facing readiness boundary. Do not serve the temporary
      # recovery screen while the control plane is still starting.
      worker:
        condition: service_healthy
    environment:
      <<: *neko-app-env
      WORKER_ADMIN_URL: http://worker:4100
      OPENNEKO_RESTART_WEB_ON_PASSWORD_CHANGE: "1"
      # Base URL for emailed sign-in links and OAuth callbacks. Set it to the
      # URL people open when the web port is behind a proxy or another host.
      OPENNEKO_PUBLIC_URL: ${OPENNEKO_PUBLIC_URL:-http://localhost:${OPENNEKO_PORT:-3000}}
      OPENNEKO_MAP_STYLE: ${OPENNEKO_MAP_STYLE:-}
      OPENNEKO_GRAPHJIN_URL: http://openneko-serve:8089
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      OPENNEKO_SANDBOX_URL: ${OPENNEKO_SANDBOX_URL:-}
      OPENNEKO_SANDBOX_KEY: ${OPENNEKO_SANDBOX_KEY:-}
      OPENNEKO_AGENT_RUNS_DIR: /var/lib/openneko/agent-runs
    ports:
      # Web is the intentional server boundary. Operators can restrict it to
      # loopback with OPENNEKO_WEB_BIND_ADDRESS=127.0.0.1 when desired.
      - "${OPENNEKO_WEB_BIND_ADDRESS:-0.0.0.0}:${OPENNEKO_PORT:-3000}:8080"
    volumes:
      - openneko-config:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
      - openneko-agent-runs:/var/lib/openneko/agent-runs
      - openneko-run:/run/openneko
    restart: unless-stopped

  worker:
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    depends_on:
      neko-db:
        condition: service_healthy
      openneko-serve:
        condition: service_started
    environment:
      <<: *neko-app-env
      OPENNEKO_GRAPHJIN_URL: http://openneko-serve:8089
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      OPENNEKO_SANDBOX_URL: ${OPENNEKO_SANDBOX_URL:-}
      OPENNEKO_SANDBOX_KEY: ${OPENNEKO_SANDBOX_KEY:-}
      OPENNEKO_AGENT_RUNS_DIR: /var/lib/openneko/agent-runs
    expose:
      - "4100"
    volumes:
      - openneko-config:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
      - openneko-agent-runs:/var/lib/openneko/agent-runs
      - openneko-run:/run/openneko
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  neko-db-data:
  neko-db-socket:
  openneko-config:
  openneko-files:
  openneko-serve-credentials:
  openneko-graphjin-cli:
  openneko-agent-home:
  openneko-agent-tmp:
  openneko-agent-runs:
  openneko-run:
