# Demo overlay: AdventureWorks trial bundle. Spins up a second Postgres for
# the AdventureWorks dataset and the one-shot CSV loader, points the
# customer GraphJin in openneko serve at the AdventureWorks config that
# serve-init seeds from the serve image, and runs the neko-side seed step
# that wires demo workflows into the operator's neko-db. Image-pinned
# variants of the services in compose.adventureworks.yml.
services:
  adventureworks-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CUSTOMER_PGUSER:-postgres}
      POSTGRES_PASSWORD: ${CUSTOMER_PGPASSWORD:-postgres}
      POSTGRES_DB: ${ADVENTUREWORKS_DB:-adventureworks}
    volumes:
      - adventureworks-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CUSTOMER_PGUSER:-postgres} -d ${ADVENTUREWORKS_DB:-adventureworks}"]
      interval: 5s
      timeout: 5s
      retries: 20

  adventureworks-init:
    # Uses the worker image with the baked AdventureWorks loader
    # (db/load-adventureworks-baked.sh + apps/worker/scripts/load-adventureworks.ts).
    # No separate image needed — the worker image already has node, tsx,
    # pg, curl, unzip, and postgresql-client.
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    depends_on:
      adventureworks-db:
        condition: service_healthy
    environment:
      PGHOST: adventureworks-db
      PGPORT: 5432
      PGUSER: ${CUSTOMER_PGUSER:-postgres}
      PGPASSWORD: ${CUSTOMER_PGPASSWORD:-postgres}
      ADVENTUREWORKS_DB: ${ADVENTUREWORKS_DB:-adventureworks}
      ADVENTUREWORKS_CACHE_DIR: /cache
    entrypoint: ["/bin/sh", "/app/db/load-adventureworks-baked.sh"]
    volumes:
      - adventureworks-cache:/cache
    restart: "no"

  # The demo keeps its GraphJin config on the dedicated graphjin-config
  # volume, seeded from the AdventureWorks sources template. Compose replaces
  # the core mount for the same container path. The seed step runs before
  # serve-init, so the demo's 'adventureworks' org is the first org row and
  # the GraphJin secret matches it.
  openneko-serve-init:
    depends_on:
      neko-adventureworks-seed:
        condition: service_completed_successfully
    environment:
      OPENNEKO_GRAPHJIN_SEED: /seed/dev.sources.yml
    volumes:
      - graphjin-config:/config/graphjin

  # The customer GraphJin in serve reads the AdventureWorks config. This is
  # what the setup wizard's "GraphJin URL" defaults to (http://graphjin:8080).
  openneko-serve:
    depends_on:
      adventureworks-init:
        condition: service_completed_successfully
    volumes:
      - graphjin-config:/config/graphjin

  neko-adventureworks-seed:
    profiles: ["steps"]
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    depends_on:
      # neko-migrate completion guarantees the organization / data_source /
      # onboarding_wizard / workflow tables this seed writes into exist.
      neko-migrate:
        condition: service_completed_successfully
      adventureworks-init:
        condition: service_completed_successfully
      # openneko-config-init repairs the config volume's ownership; reading
      # config.json / the secret-key before that chown returned EACCES, which
      # older secret-crypt turned into a destructive key regeneration.
      openneko-config-init:
        condition: service_completed_successfully
    environment:
      XDG_CONFIG_HOME: /config
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: secret
      NEKO_PG_DATABASE: neko
      ADVENTUREWORKS_GRAPHJIN_ROOT: ${ADVENTUREWORKS_GRAPHJIN_ROOT:-http://graphjin:8080}
      # This overlay always starts the JWT-protected sources config below, so
      # seed the matching mode deterministically instead of relying on a
      # post-start capability probe to discover it.
      ADVENTUREWORKS_AUTH_MODE: jwt
      # Reconcile installs whose demo source was seeded by an older release as
      # anonymous. This only changes a source labelled AdventureWorks.
      ADVENTUREWORKS_RECONCILE_AUTH_MODE: "1"
    volumes:
      - openneko-config:/config/openneko
    # --import tsx/esm so the seed's `import("@neko/secret-crypt")` (raw .ts
    # under node_modules) transpiles; plain node refuses to strip those types.
    command: ["node", "--import", "tsx/esm", "node_modules/@neko/db/src/seed-adventureworks.mjs"]
    restart: "no"

  adventureworks-simulator:
    # Trickles realistic sales orders into the AdventureWorks DB on a
    # schedule so the workspace reacts during a trial (briefing numbers
    # drift, cron workflows fire, runs accumulate). Set AW_SIM_ENABLED=0
    # to disable. Uses the worker image because psql + the tick script
    # are already baked in at /app/db/seeds/dev/aw-sim-tick.sql; no
    # bind-mount of repo files needed for the packaged install.
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      adventureworks-init:
        condition: service_completed_successfully
    environment:
      PGHOST: adventureworks-db
      PGPORT: 5432
      PGUSER: ${CUSTOMER_PGUSER:-postgres}
      PGPASSWORD: ${CUSTOMER_PGPASSWORD:-postgres}
      PGDATABASE: ${ADVENTUREWORKS_DB:-adventureworks}
      AW_SIM_INTERVAL_SEC: ${AW_SIM_INTERVAL_SEC:-600}
      AW_SIM_ORDERS_MIN: ${AW_SIM_ORDERS_MIN:-3}
      AW_SIM_ORDERS_MAX: ${AW_SIM_ORDERS_MAX:-10}
      AW_SIM_ENABLED: ${AW_SIM_ENABLED:-1}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ "$${AW_SIM_ENABLED}" != "1" ]; then
          echo "[aw-sim] AW_SIM_ENABLED=$${AW_SIM_ENABLED}; sleeping forever"
          exec tail -f /dev/null
        fi
        echo "[aw-sim] starting: interval=$${AW_SIM_INTERVAL_SEC}s, orders=$${AW_SIM_ORDERS_MIN}-$${AW_SIM_ORDERS_MAX} per tick"
        while true; do
          ORDERS=$$(awk -v mn=$${AW_SIM_ORDERS_MIN} -v mx=$${AW_SIM_ORDERS_MAX} 'BEGIN{srand(); print int(mn + rand()*(mx-mn+1))}')
          psql -v ON_ERROR_STOP=1 -c "SET trial_sim.orders_per_tick TO '$$ORDERS'" -f /app/db/seeds/dev/aw-sim-tick.sql \
            || echo "[aw-sim] tick failed; will retry next interval"
          sleep "$${AW_SIM_INTERVAL_SEC}"
        done

  adventureworks-scenario-injector:
    # L3 scripted-scenario scheduler. On startup: bootstraps trial_sim
    # schema, then runs advance-dates.sql so demo dates land on or after
    # CURRENT_DATE (idempotent — gated to once per 12 hours via
    # trial_sim.state.advance_dates_at). Then loops the scenario
    # scheduler. Set TRIAL_SIM_ENABLED=0 to disable. Uses the worker
    # image because all scripts + scenarios + psql are baked at
    # /app/db/seeds/dev/.
    image: ghcr.io/open-neko/neko-worker:${OPENNEKO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      adventureworks-init:
        condition: service_completed_successfully
    environment:
      PGHOST: adventureworks-db
      PGPORT: 5432
      PGUSER: ${CUSTOMER_PGUSER:-postgres}
      PGPASSWORD: ${CUSTOMER_PGPASSWORD:-postgres}
      PGDATABASE: ${ADVENTUREWORKS_DB:-adventureworks}
      TRIAL_SIM_TICK_SEC: ${TRIAL_SIM_TICK_SEC:-300}
      TRIAL_SIM_ENABLED: ${TRIAL_SIM_ENABLED:-1}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ "$${TRIAL_SIM_ENABLED}" != "1" ]; then
          echo "[trial-sim] TRIAL_SIM_ENABLED=$${TRIAL_SIM_ENABLED}; sleeping forever"
          exec tail -f /dev/null
        fi
        exec /bin/sh /app/db/seeds/dev/scenario-injector.sh loop

  web:
    depends_on:
      # The worker patches GraphJin's per-org JWT secret during startup. Wait
      # for its first provisioning pass before serving the demo UI.
      worker:
        condition: service_healthy
    environment:
      # The packaged demo overrides core's neutral config with its
      # AdventureWorks source-mode config in a dedicated volume.
      OPENNEKO_STACK_MODE: demo
      OPENNEKO_GRAPHJIN_CONFIG: /graphjin-config/agentic.yml
      # Trial default: route every external action (e.g. send_webhook) to
      # the mock adapter so bundled workflows can propose Slack alerts
      # without hitting real endpoints. Flip to "false" once you're past
      # trial and have wired real webhooks.
    volumes:
      - graphjin-config:/graphjin-config

  worker:
    environment:
      # Sources mode: the worker substitutes the per-org JWT secret into
      # the seeded GraphJin config at boot (host-provision).
      OPENNEKO_STACK_MODE: demo
      OPENNEKO_GRAPHJIN_CONFIG: /graphjin-config/agentic.yml
    volumes:
      - graphjin-config:/graphjin-config

volumes:
  adventureworks-db-data:
  adventureworks-cache:
  graphjin-config:
