version: 2

project_name: openneko

before:
  hooks:
    - go mod tidy
    - ./scripts/sync-migrations.sh --check

builds:
  - id: openneko
    main: ./cmd/openneko
    binary: openneko
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/open-neko/neko/apps/openneko/internal/version.Version={{.Version}}
      - -X github.com/open-neko/neko/apps/openneko/internal/version.Commit={{.Commit}}
      - -X github.com/open-neko/neko/apps/openneko/internal/version.CommitTimestamp={{.Date}}

archives:
  - id: openneko
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: open-neko
    name: openneko
  draft: false
  prerelease: auto

# The Homebrew cask installs the native archive; the native-archives job of
# release-binaries.yml writes it with scripts/write-brew-cask.sh.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
