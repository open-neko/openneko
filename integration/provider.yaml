id: harness-m2
category: agent
display_name: Harness M2 synthetic provider
description: Test credentials only
inference_capable: false
credentials:
  - name: api_key
    env_vars: [MODEL_API_KEY]
    required: true
    refresh:
      strategy: oauth2_client_credentials
      token_url: http://127.0.0.1:18081/token
      refresh_before_seconds: 5
      material:
        - name: client_id
          required: true
        - name: client_secret
          required: true
          secret: true
endpoints:
  - host: model-fixture
    port: 8443
    path: /v1/**
    protocol: rest
    enforcement: enforce
    access: read-write
  - host: model-fixture
    port: 8080
    path: /v1/**
    protocol: rest
    enforcement: enforce
    access: read-write
binaries: [/usr/local/bin/harness-probe]
