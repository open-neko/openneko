app_name: harness-m3
host_port: 0.0.0.0:8080
production: false
web_ui: false
secret_key: harness-m3-synthetic-key
log_level: info
database:
  type: postgres
  host: postgres
  port: 5432
  dbname: fixture
  user: fixture
  password: fixture
agent:
  enabled: true
  provider: openai-compatible
  model: graphjin-fixture
  api_key_env: GRAPHJIN_AGENT_API_KEY
  base_url: http://model:8080/v1
  max_steps: 6
  timeout_seconds: 30
  read_only: true
  return_trace: true
