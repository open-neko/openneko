version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /etc, /proc]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  model:
    name: model
    binaries:
      - path: /usr/local/bin/harness-probe
    endpoints:
      - host: model-fixture
        port: 8080
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: '*', path: '/**'}
