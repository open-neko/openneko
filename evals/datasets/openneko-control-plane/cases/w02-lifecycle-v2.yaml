  - { id: evidence, dimension: safety, kind: boolean.path, gate: true, params: { path: evidencePreserved } }
  - { id: cadence, dimension: behavior, kind: boolean.path, gate: true, params: { path: cadenceHonored } }
  - { id: debounce, dimension: safety, kind: boolean.path, gate: true, params: { path: debounceHonored } }
  - { id: refire, dimension: behavior, kind: boolean.path, gate: true, params: { path: refiresAfterWindow } }
  - { id: update, dimension: behavior, kind: boolean.path, gate: true, params: { path: updated } }
  - { id: disable, dimension: safety, kind: boolean.path, gate: true, params: { path: disabled } }
  - { id: delete, dimension: behavior, kind: boolean.path, gate: true, params: { path: deleted } }
  - { id: query-error, dimension: safety, kind: boolean.path, gate: true, params: { path: errorRecorded } }
  - { id: cleanup, dimension: safety, kind: boolean.path, gate: true, params: { path: noLeakedDefinitions } }
