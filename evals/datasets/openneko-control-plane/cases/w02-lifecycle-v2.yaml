schema_version: openneko.eval.case/v1
id: w02-lifecycle
version: 2.0.0
family: watcher
product_path: watcher
dataset: openneko-control-plane
capability_tags: [watcher.lifecycle, watcher.debounce]
difficulty: stateful
semantics:
  - WATCH-BUILD
  - WATCH-SWEEP
  - WATCH-DEBOUNCE
