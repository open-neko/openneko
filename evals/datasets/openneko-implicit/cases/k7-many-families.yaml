  steps:
    - {"id":"customers-1","kind":"chat","thread":"c1","question":"How many distinct customers placed at least one sales order in the 30-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 30-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"oracle"}}
    - {"id":"customers-2","kind":"chat","thread":"c2","question":"How many distinct customers placed at least one sales order in the 45-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 45-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"oracle"}}
