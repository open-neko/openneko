    - {"id":"customers-4","kind":"chat","thread":"c4","question":"How many distinct customers placed at least one sales order in the 75-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 75-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"oracle"}}
    - {"id":"customers-5","kind":"chat","thread":"c5","question":"How many distinct customers placed at least one sales order in the 105-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 105-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"oracle"}}
    - {"id":"average-1","kind":"chat","thread":"a1","question":"What was the average subtotal per sales order in the 30-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 30-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"ack"}}
    - {"id":"average-2","kind":"chat","thread":"a2","question":"What was the average subtotal per sales order in the 45-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 45-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"ack"}}
    - {"id":"average-3","kind":"chat","thread":"a3","question":"What was the average subtotal per sales order in the 60-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 60-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"ack"}}
    - {"id":"average-4","kind":"chat","thread":"a4","question":"What was the average subtotal per sales order in the 75-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 75-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"ack"}}
    - {"id":"average-5","kind":"chat","thread":"a5","question":"What was the average subtotal per sales order in the 105-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 105-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"ack"}}
    - {"id":"lines-1","kind":"chat","thread":"l1","question":"How many sales order lines did we book in the 30-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 30-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"ack"}}
    - {"id":"lines-2","kind":"chat","thread":"l2","question":"How many sales order lines did we book in the 45-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 45-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"ack"}}
    - {"id":"lines-3","kind":"chat","thread":"l3","question":"How many sales order lines did we book in the 60-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 60-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"ack"}}
    - {"id":"lines-4","kind":"chat","thread":"l4","question":"How many sales order lines did we book in the 75-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 75-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"ack"}}
    - {"id":"lines-5","kind":"chat","thread":"l5","question":"How many sales order lines did we book in the 105-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 105-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"answer":"ack"}}
    - {"id":"discover-1","kind":"discover","scripted":{"action":"create","skill":{"name":"aw-customer-activity","description":"Count distinct AdventureWorks customers who placed sales orders in a day-count window and compare with the window before.","body":"1. Find the latest sales-order date. That date is the anchor.\n2. Build the current window from the day count. Both endpoints count.\n3. Count each customer once in the current window.\n4. Count the same way in the window of equal length just before.\n5. Report both counts and the current window dates."},"quote":"distinct customers","bad":"as-good"}}
    - {"id":"discover-2","kind":"discover","scripted":{"action":"create","skill":{"name":"aw-average-order-value","description":"Average the subtotal per AdventureWorks sales order in a day-count window and compare with the window before.","body":"1. Find the latest sales-order date.\n2. Build the current window. Both endpoints count.\n3. Divide the summed subtotal by the number of orders.\n4. Do the same for the window before.\n5. Report both averages and the window dates."},"quote":"average subtotal per sales order","bad":"duplicate","duplicate_of":"aw-customer-activity"}}
    - {"id":"discover-3","kind":"discover","scripted":{"action":"create","skill":{"name":"aw-order-line-volume","description":"Count AdventureWorks sales order lines booked in a day-count window and compare with the window before.","body":"1. Find the latest sales-order date.\n2. Build the current window. Both endpoints count.\n3. Count order detail lines whose order falls in the window.\n4. Do the same for the window before.\n5. Report both counts and the window dates."},"quote":"sales order lines","bad":"duplicate","duplicate_of":"aw-customer-activity"}}
