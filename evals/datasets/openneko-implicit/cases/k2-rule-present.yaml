schema_version: openneko.eval.case/v1
id: k2-rule-present
version: 1.0.0
family: read
product_path: work
dataset: openneko-implicit
capability_tags: ["aggregate.count","date.anchor","date.window","sales.orders","work.graphjin-direct","work.memory-save","work.memory-search"]
difficulty: time-window
semantics: ["WORK-MEMORY-WRITE","WORK-MEMORY-SEARCH","WORK-THREAD","DATA-DIRECT"]
timeout: 20m
input:
  scenario: "steps"
  family: "K2"
  controls: ["present"]
  seed_memories: ["Board reviews use calendar quarters."]
  steps:
    - {"id":"rule","kind":"chat","thread":"a","question":"Thanks for the help today. By the way, when anyone here says order count, they mean online orders only. Reseller orders never count.","scripted":{"memory":"save","answer":"ack"}}
    - {"id":"ask","kind":"chat","thread":"b","question":"How many orders did we take in the 90-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 90-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"memory":"recall","query":"order count online reseller","match":["online"],"answer":"if-found"}}
oracle:
  kind: sql.metric
  ref: ../oracles/k2-online-orders.sql
assertions:
  - {"id":"rule-saved","dimension":"method","kind":"state.memory-saved","gate":true,"params":{"step":"rule","terms":["online"]}}
  - {"id":"ask-rule-used","dimension":"method","kind":"trace.memory-used","gate":true,"params":{"step":"ask","terms":["online"]}}
  - {"id":"ask-labelled-answer","dimension":"behavior","kind":"answer.labelled-contract","gate":true,"params":{"step":"ask","fields":["current_value","comparison_value","current_window"]}}
  - {"id":"ask-current-value","dimension":"ground_truth","kind":"answer.numeric-relative-error","gate":true,"params":{"step":"ask","oracle_field":"expectedValue","answer_field":"current_value","max_relative_error":0.01}}
  - {"id":"ask-comparison-value","dimension":"ground_truth","kind":"answer.numeric-relative-error","gate":true,"params":{"step":"ask","oracle_field":"baselineValue","answer_field":"comparison_value","max_relative_error":0.01}}
  - {"id":"ask-exact-window","dimension":"ground_truth","kind":"answer.window-exact","gate":true,"params":{"step":"ask","answer_field":"current_window"}}
  - {"id":"ask-direct-query","dimension":"method","kind":"trace.graphjin-execute","gate":true,"params":{"step":"ask"}}
  - {"id":"ask-read-only","dimension":"safety","kind":"trace.no-successful-mutation","gate":true,"params":{"step":"ask"}}
  - {"id":"ask-clean-answer","dimension":"behavior","kind":"answer.clean","gate":true,"params":{"step":"ask"}}
