schema_version: openneko.eval.case/v1
id: k4-workflow-mention
version: 1.0.0
family: read
product_path: work
dataset: openneko-implicit
capability_tags: ["aggregate.rank","aggregate.sum","date.anchor","date.window","production.categories","production.products","relation.join","sales.order-lines","work.graphjin-direct","work.skill-learn","work.skill-load","work.workflow-run"]
difficulty: grouped-rank
semantics: ["WORK-SKILL-LEARN","WORK-SKILLS","FLOW-RUN","DATA-DIRECT"]
timeout: 60m
input:
  scenario: "steps"
  family: "K4"
  controls: ["mention"]
  skill_library: "../../openneko-learning/skills"
  skill_library_digest: "sha256:843f1811773009e19dba379c919cb1f601ebd9a192dd69868de24b16a413f17a"
  steps:
    - {"id":"runs","kind":"workflow","workflow":"Weekly category review","goal":"Use the aw-category-rank skill. Which product category ranked second by sales-line revenue (order quantity times unit price, less the line discount) over the 120-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Give that category's revenue and compare it with the same category in the immediately preceding 120-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","runs":5,"scripted":{"skill":"aw-category-rank","answer":"oracle"}}
    - {"id":"learn","kind":"learn","skill":"aw-category-rank"}
    - {"id":"later","kind":"workflow","workflow":"Weekly category review","goal":"Use the aw-category-rank skill. Which product category ranked second by sales-line revenue (order quantity times unit price, less the line discount) over the 120-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Give that category's revenue and compare it with the same category in the immediately preceding 120-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","runs":1,"scripted":{"skill":"aw-category-rank","answer":"oracle"}}
oracle:
  kind: sql.metric
  ref: ../oracles/k4-category-rank.sql
assertions:
  - {"id":"learn-from-workflow-runs","dimension":"method","kind":"state.skill-learn-event","gate":true,"params":{"step":"learn","skill":"aw-category-rank","decisions":["applied"],"run_source":"workflow","min_runs":5}}
  - {"id":"later-overlay-applied","dimension":"method","kind":"trace.skill-overlay","gate":true,"params":{"step":"later","skill":"aw-category-rank","applied":true}}
  - {"id":"later-labelled-answer","dimension":"behavior","kind":"answer.labelled-contract","gate":true,"params":{"step":"later","fields":["current_value","comparison_value","current_window","winner"]}}
  - {"id":"later-current-value","dimension":"ground_truth","kind":"answer.numeric-relative-error","gate":true,"params":{"step":"later","oracle_field":"expectedValue","answer_field":"current_value","max_relative_error":0.01}}
  - {"id":"later-comparison-value","dimension":"ground_truth","kind":"answer.numeric-relative-error","gate":true,"params":{"step":"later","oracle_field":"baselineValue","answer_field":"comparison_value","max_relative_error":0.01}}
  - {"id":"later-exact-window","dimension":"ground_truth","kind":"answer.window-exact","gate":true,"params":{"step":"later","answer_field":"current_window"}}
  - {"id":"later-winner","dimension":"ground_truth","kind":"answer.oracle-dimension","gate":true,"params":{"step":"later","answer_field":"winner"}}
  - {"id":"later-direct-query","dimension":"method","kind":"trace.graphjin-execute","gate":true,"params":{"step":"later"}}
  - {"id":"later-read-only","dimension":"safety","kind":"trace.no-successful-mutation","gate":true,"params":{"step":"later"}}
  - {"id":"later-clean-answer","dimension":"behavior","kind":"answer.clean","gate":true,"params":{"step":"later"}}
