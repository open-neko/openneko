schema_version: openneko.eval.case/v1
id: k3-library-present
version: 1.0.0
family: read
product_path: work
dataset: openneko-implicit
capability_tags: ["aggregate.count","date.anchor","date.window","sales.orders","work.graphjin-direct","work.library-search","work.library-upload"]
difficulty: time-window
semantics: ["LIBRARY-DISTILL","WORK-LIBRARY-SEARCH","DATA-DIRECT"]
timeout: 20m
input:
  scenario: "steps"
  family: "K3"
  controls: ["present","decoy"]
  steps:
    - {"id":"upload-current","kind":"upload","document":"current","path":"../documents/sales-handbook-2026.md"}
    - {"id":"upload-stale","kind":"upload","document":"stale","path":"../documents/sales-handbook-2019.md"}
    - {"id":"upload-decoy","kind":"upload","document":"decoy","path":"../documents/travel-policy.md"}
    - {"id":"ask","kind":"chat","thread":"a","question":"How many strategic orders did we book in the 90-day window that ends on the latest sales-order date? Every day-count window includes both endpoints. Compare it with the immediately preceding 90-day window. Put each requested field on its own line using these exact labels: Current value, Comparison value, Current window, and Winner; omit Winner when no named winner was requested.","scripted":{"library":"search","query":"strategic order definition","match":["10,000"],"answer":"if-found"}}
oracle:
  kind: sql.metric
  ref: ../oracles/k3-strategic-orders.sql
assertions:
  - {"id":"documents-cataloged","dimension":"method","kind":"state.library-cataloged","gate":true,"params":{"documents":["current","stale","decoy"]}}
  - {"id":"ask-current-retrieved","dimension":"method","kind":"trace.library-document-retrieved","gate":true,"params":{"step":"ask","document":"current"}}
  - {"id":"ask-labelled-answer","dimension":"behavior","kind":"answer.labelled-contract","gate":true,"params":{"step":"ask","fields":["current_value","comparison_value","current_window"]}}
  - {"id":"ask-current-value","dimension":"ground_truth","kind":"answer.numeric-relative-error","gate":true,"params":{"step":"ask","oracle_field":"expectedValue","answer_field":"current_value","max_relative_error":0.01}}
  - {"id":"ask-comparison-value","dimension":"ground_truth","kind":"answer.numeric-relative-error","gate":true,"params":{"step":"ask","oracle_field":"baselineValue","answer_field":"comparison_value","max_relative_error":0.01}}
  - {"id":"ask-exact-window","dimension":"ground_truth","kind":"answer.window-exact","gate":true,"params":{"step":"ask","answer_field":"current_window"}}
  - {"id":"ask-direct-query","dimension":"method","kind":"trace.graphjin-execute","gate":true,"params":{"step":"ask"}}
  - {"id":"ask-read-only","dimension":"safety","kind":"trace.no-successful-mutation","gate":true,"params":{"step":"ask"}}
  - {"id":"ask-clean-answer","dimension":"behavior","kind":"answer.clean","gate":true,"params":{"step":"ask"}}
