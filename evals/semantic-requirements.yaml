schema_version: openneko.eval.semantic-requirements/v1

# Coverage requirements merged into semantics.yaml by `semantics:generate`.
# `tiers` and `controls` record the layers and control cases that cover each
# semantic. A semantic without `disposition` is `eval` when a case cites it and
# `declared` otherwise. `excluded` requires `excluded_reason` and `covered_by`.
