# OpenNeko's database as a container, for a source checkout. Add it after
# compose.yml for development and demo data. The packaged copy is
# apps/openneko/assets/compose/bundled-db.yml.
services:
  neko-db:
    # pgvector image: base postgres:16 with the vector extension preinstalled.
    build:
      context: .
      target: neko-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neko
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: neko
      PGDATA: /var/lib/postgresql/neko
    ports:
      - "127.0.0.1:${OPENNEKO_DB_PORT:-5432}:5432"
    volumes:
      - neko-db-data:/var/lib/postgresql/neko
      - neko-db-socket:/var/run/postgresql
    command:
      - postgres
      - -c
      - wal_compression=on
      - -c
      - temp_file_limit=5GB
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U neko -d neko
      interval: 5s
      timeout: 5s
      retries: 20

  database-check:
    depends_on:
      neko-db:
        condition: service_healthy
    environment:
      OPENNEKO_DATABASE_URL_FILE: !reset null
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
    secrets: !reset []

  storage-reconcile:
    command: ["storage", "reconcile"]
    depends_on:
      neko-db:
        condition: service_healthy
    environment:
      OPENNEKO_DATABASE_URL_FILE: !reset null
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
    secrets: !reset []

  neko-migrate:
    depends_on:
      neko-db:
        condition: service_healthy
    environment:
      OPENNEKO_DATABASE_URL_FILE: !reset null
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
    secrets: !reset []

  openneko-serve-init:
    environment:
      OPENNEKO_DATABASE_URL_FILE: !reset null
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
    secrets: !reset []

  openneko-serve:
    depends_on:
      neko-db:
        condition: service_healthy

  web:
    environment:
      OPENNEKO_DATABASE_URL_FILE: !reset null
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: secret
      NEKO_PG_DATABASE: neko
    secrets: !reset []

  worker:
    depends_on:
      neko-db:
        condition: service_healthy
    environment:
      OPENNEKO_DATABASE_URL_FILE: !reset null
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: secret
      NEKO_PG_DATABASE: neko
    secrets: !reset []

volumes:
  neko-db-data:
  neko-db-socket:
