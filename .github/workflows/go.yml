name: openneko (go)

on:
  push:
    branches: [main]
    paths:
      - "apps/openneko/**"
      - "apps/ax-harness/**"
      - "recipes/sandbox/**"
      - "db/migrations/**"
      - "packages/**"
      - "apps/web/**"
      - "Dockerfile"
      - "compose.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "apps/openneko/**"
      - "apps/ax-harness/**"
      - "recipes/sandbox/**"
      - "db/migrations/**"
      - "packages/**"
      - "apps/web/**"
      - "Dockerfile"
      - "compose.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/go.yml"
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    defaults:
      run:
        working-directory: apps/openneko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: apps/openneko/go.sum

      - name: Verify embedded migrations are in sync
        run: ./scripts/sync-migrations.sh --check

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean; run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: go build
        run: go build ./...

      - name: Run the native server install tests as root
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -c -o /tmp/cli.test ./internal/cli
          docker run --rm -e OPENNEKO_TEST_SERVER_INSTALL=1 -v /tmp/cli.test:/cli.test:ro \
            debian:bookworm-slim /cli.test -test.v -test.run 'TestServerInstall|TestServerRestore' | tee /tmp/server-install.log
          grep -q -- '--- PASS: TestServerInstallZones' /tmp/server-install.log
          if grep -- '--- SKIP' /tmp/server-install.log; then
            echo "a root test skipped; this step must run every one" >&2
            exit 1
          fi

  test-database:
    name: test (ubuntu-22.04, postgres)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neko
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: openneko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neko -d openneko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENNEKO_TEST_DATABASE_URL: postgres://neko:secret@127.0.0.1:5432/openneko_test?sslmode=disable
      OPENNEKO_TEST_DUCKDB: ${{ github.workspace }}/.bin/duckdb
      OPENNEKO_TEST_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: apps/openneko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: apps/openneko/go.sum

      - name: Install the DuckDB CLI (the version and checksum in the Dockerfile)
        run: |
          version=$(sed -n 's/^ARG DUCKDB_VERSION=//p' "$GITHUB_WORKSPACE/Dockerfile")
          sum=$(grep -o 'amd64) sum=[0-9a-f]*' "$GITHUB_WORKSPACE/Dockerfile" | head -1 | cut -d= -f2)
          test -n "$version" && test -n "$sum"
          curl -fsSL --retry 5 -o /tmp/duckdb.gz \
            "https://github.com/duckdb/duckdb/releases/download/${version}/duckdb_cli-linux-amd64.gz"
          echo "$sum  /tmp/duckdb.gz" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/.bin"
          gunzip -c /tmp/duckdb.gz > "$OPENNEKO_TEST_DUCKDB"
          chmod 0755 "$OPENNEKO_TEST_DUCKDB"
          "$OPENNEKO_TEST_DUCKDB" --version

      - name: Install the PostgreSQL 16 client (the source in the Dockerfile)
        run: |
          set -euo pipefail
          image=$(sed -n 's/^FROM \(pgvector\/pgvector:[^ ]*@sha256:[0-9a-f]*\) AS neko-db$/\1/p' "$GITHUB_WORKSPACE/Dockerfile")
          test -n "$image"
          docker run --rm --entrypoint cat "$image" /usr/local/share/keyrings/postgres.gpg.asc > /tmp/postgres.gpg.asc
          sudo install -D -m 0644 /tmp/postgres.gpg.asc /usr/local/share/keyrings/postgres.gpg.asc
          echo "deb [ signed-by=/usr/local/share/keyrings/postgres.gpg.asc ] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main 16" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          for tool in pg_dump pg_restore; do
            /usr/lib/postgresql/16/bin/$tool --version | grep -q '(PostgreSQL) 16\.'
          done

      - name: go vet
        run: go vet ./...

      - name: go test (with the database)
        run: |
          pg_dump --version | grep -q '(PostgreSQL) 16\.'
          go test -count=1 -timeout 20m ./...

  integration-migrator:
    name: integration - migrator (real postgres)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/openneko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: apps/openneko/go.sum

      - name: go test (database integration)
        run: go test -tags=integration -count=1 -timeout 10m ./internal/db/...

  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: |
            apps/openneko/go.sum
            apps/ax-harness/go.sum
            recipes/sandbox/go.sum

      - name: openneko
        working-directory: apps/openneko
        run: go test -count=1 -timeout 20m ./...

      - name: ax-harness
        if: ${{ !cancelled() }}
        working-directory: apps/ax-harness
        run: go test -count=1 -timeout 20m ./...

      - name: sandbox
        if: ${{ !cancelled() }}
        working-directory: recipes/sandbox
        run: go test -count=1 ./...

  windows-build:
    name: windows build
    runs-on: ubuntu-22.04
    env:
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: |
            apps/openneko/go.sum
            apps/ax-harness/go.sum
            recipes/sandbox/go.sum

      - name: openneko
        working-directory: apps/openneko
        run: |
          go vet ./...
          go build -o /dev/null ./cmd/openneko

      - name: ax-harness
        working-directory: apps/ax-harness
        run: |
          go vet ./...
          go build -o /dev/null ./cmd/ax-harness

      - name: sandbox
        working-directory: recipes/sandbox
        run: |
          go vet ./...
          go build -o /dev/null .

  goreleaser-check:
    name: goreleaser check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
          workdir: apps/openneko
