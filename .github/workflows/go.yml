name: openneko (go)

on:
  push:
    branches: [main]
    paths:
      - "apps/openneko/**"
      - "apps/ax-harness/**"
      - "db/migrations/**"
      - "packages/**"
      - "apps/web/**"
      - "Dockerfile"
      - "compose.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "apps/openneko/**"
      - "apps/ax-harness/**"
      - "db/migrations/**"
      - "packages/**"
      - "apps/web/**"
      - "Dockerfile"
      - "compose.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/go.yml"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    defaults:
      run:
        working-directory: apps/openneko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: apps/openneko/go.sum

      - name: Verify embedded migrations are in sync
        run: ./scripts/sync-migrations.sh --check

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean; run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: go build
        run: go build ./...

  test-database:
    name: test (ubuntu-22.04, postgres)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neko
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: openneko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neko -d openneko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENNEKO_TEST_DATABASE_URL: postgres://neko:secret@127.0.0.1:5432/openneko_test?sslmode=disable
      OPENNEKO_TEST_DUCKDB: ${{ github.workspace }}/.bin/duckdb
      OPENNEKO_TEST_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: apps/openneko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: apps/openneko/go.sum

      - name: Install the DuckDB CLI (the version and checksum in the Dockerfile)
        run: |
          version=$(sed -n 's/^ARG DUCKDB_VERSION=//p' "$GITHUB_WORKSPACE/Dockerfile")
          sum=$(grep -o 'amd64) sum=[0-9a-f]*' "$GITHUB_WORKSPACE/Dockerfile" | head -1 | cut -d= -f2)
          test -n "$version" && test -n "$sum"
          curl -fsSL --retry 5 -o /tmp/duckdb.gz \
            "https://github.com/duckdb/duckdb/releases/download/${version}/duckdb_cli-linux-amd64.gz"
          echo "$sum  /tmp/duckdb.gz" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/.bin"
          gunzip -c /tmp/duckdb.gz > "$OPENNEKO_TEST_DUCKDB"
          chmod 0755 "$OPENNEKO_TEST_DUCKDB"
          "$OPENNEKO_TEST_DUCKDB" --version

      - name: go vet
        run: go vet ./...

      - name: go test (with the database)
        run: go test -count=1 -timeout 20m ./...

  integration-migrator:
    name: integration - migrator (real postgres)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/openneko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: apps/openneko/go.sum

      - name: go test (database integration)
        run: go test -tags=integration -count=1 -timeout 10m ./internal/db/...

  goreleaser-check:
    name: goreleaser check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
          workdir: apps/openneko
