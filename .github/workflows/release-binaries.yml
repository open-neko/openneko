name: openneko release binaries
run-name: openneko release binaries (${{ github.event.inputs.tag || github.event.release.tag_name }})

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (must already exist; e.g. v0.0.0-rc1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-image:
    # Build on manual workflow_dispatch (preview/branch builds) OR on a real
    # STABLE release. Skip release events for pre-release tags (e.g.
    # v1.18.0-preview.N): release-please auto-publishes a Release for every tag
    # we push, which would otherwise (a) double-build alongside the manual run
    # and (b) tag :latest from an unreleased preview, clobbering downloads. The
    # manual run builds previews WITHOUT :latest; stable releases (tag has no
    # '-') still build and tag :latest as before.
    if: ${{ github.event_name != 'release' || !contains(github.event.release.tag_name, '-') }}
    name: ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # All ten builders run at once; the registry cache keeps the GHCR pushes small.
      max-parallel: 10
      matrix:
        include:
          - image: neko-web
            target: web
            platform: linux/amd64
            runner: ubuntu-22.04
          - image: neko-web
            target: web
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: neko-cli
            target: neko-cli
            platform: linux/amd64
            runner: ubuntu-22.04
          - image: neko-cli
            target: neko-cli
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: neko-serve
            target: neko-serve
            platform: linux/amd64
            runner: ubuntu-22.04
          - image: neko-serve
            target: neko-serve
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: neko-db
            target: neko-db
            platform: linux/amd64
            runner: ubuntu-22.04
          - image: neko-db
            target: neko-db
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: neko-sandbox
            context: recipes/sandbox
            file: recipes/sandbox/Dockerfile
            platform: linux/amd64
            runner: ubuntu-22.04
          - image: neko-sandbox
            context: recipes/sandbox
            file: recipes/sandbox/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          # Manual recovery runs may contain CI hardening newer than the tag;
          # release events continue to build the immutable tagged source.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.release.tag_name }}

      - name: Resolve release tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Resolve built source commit
        id: source-commit
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute arch-safe platform key (amd64 / arm64)
        id: archkey
        run: echo "value=${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.file || './Dockerfile' }}
          build-args: |
            OPENNEKO_VERSION=${{ steps.tag.outputs.value }}
            OPENNEKO_COMMIT=${{ steps.source-commit.outputs.value }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/open-neko/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # The layer cache lives in GHCR: every release tag can read it, and it
          # stays out of the Actions cache that the Go checks need.
          cache-from: type=registry,ref=ghcr.io/open-neko/${{ matrix.image }}:buildcache-${{ steps.archkey.outputs.value }}
          # Cache push failures must not invalidate an image already pushed
          # successfully to GHCR.
          cache-to: type=registry,ref=ghcr.io/open-neko/${{ matrix.image }}:buildcache-${{ steps.archkey.outputs.value }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Enforce compressed image-size budget
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # The restored workspace agent measured 764.3 MiB on linux/amd64 in
          # v2.30.4. Keep a narrow ceiling rather than the obsolete 575 MiB
          # bundled-runtime limit so architecture changes remain intentional.
          MAX_MIB=$(jq -er --arg image "${{ matrix.image }}" '.[$image]' scripts/image-size-budgets.json)
          bash scripts/check-image-size.sh \
            "ghcr.io/open-neko/${{ matrix.image }}@${IMAGE_DIGEST}" \
            "$MAX_MIB" \
            "${{ steps.archkey.outputs.value }}"

      - name: Stash digest for the merge step
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.image }}-${{ steps.archkey.outputs.value }}

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ steps.archkey.outputs.value }}
          path: /tmp/digests/${{ matrix.image }}-${{ steps.archkey.outputs.value }}
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    # Same guard as build-image (also auto-skips via needs): never merge/tag a
    # pre-release tag on a release event — and crucially never tag :latest from
    # one. Stable releases + manual runs proceed.
    if: ${{ github.event_name != 'release' || !contains(github.event.release.tag_name, '-') }}
    name: merge manifest (${{ matrix.image }})
    runs-on: ubuntu-22.04
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        image: [neko-web, neko-cli, neko-serve, neko-db, neko-sandbox]
    steps:
      - name: Resolve release tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Download per-arch digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/open-neko/${{ matrix.image }}
          AMD64=$(cat /tmp/digests/${{ matrix.image }}-amd64)
          ARM64=$(cat /tmp/digests/${{ matrix.image }}-arm64)
          # `:latest` only on real releases. A manual workflow_dispatch (e.g. a
          # branch preview build) publishes ONLY its specific tag, so it can
          # never clobber the `:latest` that live downloads pull.
          LATEST=""
          if [ "${{ github.event_name }}" = "release" ]; then LATEST="-t $IMAGE:latest"; fi
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.tag.outputs.value }}" \
            $LATEST \
            "$IMAGE@$AMD64" \
            "$IMAGE@$ARM64"
          docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.value }}"

  image-size:
    if: ${{ github.event_name != 'release' || !contains(github.event.release.tag_name, '-') }}
    name: image pull budget (linux/${{ matrix.arch }})
    runs-on: ubuntu-22.04
    needs: merge-manifests
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          # Read the budgets and guard scripts from the same immutable source
          # revision whose images were built above.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.release.tag_name }}

      - name: Resolve release tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Enforce aggregate unique-layer budget
        run: |
          set -euo pipefail
          # The ceiling was set while the stack still held the agent image
          # (about 800 MiB) and the OpenShell images; lower it once a release
          # without them is measured.
          MAX_MIB=$(jq -er '.uniqueStack' scripts/image-size-budgets.json)
          bash scripts/check-image-stack-size.sh \
            "${{ steps.tag.outputs.value }}" \
            "${{ matrix.arch }}" \
            "$MAX_MIB" \
            neko-web neko-cli neko-serve \
            neko-db neko-sandbox postgres:16-alpine

  goreleaser:
    name: goreleaser
    runs-on: ubuntu-22.04
    needs: [merge-manifests, image-size]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: false
      # Same paths and key prefix as .github/actions/go-cache, written out here
      # because recovery runs check out tags that predate that action.
      - id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-shared-${{ github.run_id }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-shared-

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: open-neko
          repositories: openneko

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
          workdir: apps/openneko
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  native-web:
    if: ${{ github.event_name != 'release' || !contains(github.event.release.tag_name, '-') }}
    name: native web app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @neko/web build:spa

      - uses: actions/upload-artifact@v7
        with:
          name: native-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  # The archives build beside the images; only the publish job below waits for them.
  native-build:
    if: ${{ github.event_name != 'release' || !contains(github.event.release.tag_name, '-') }}
    name: native archive (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-22.04
    needs: native-web
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: false
      # Same paths and key prefix as .github/actions/go-cache, written out here
      # because recovery runs check out tags that predate that action.
      - id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-shared-${{ github.run_id }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-shared-

      - uses: actions/download-artifact@v8
        with:
          name: native-web
          path: ${{ runner.temp }}/web

      - name: Build the native archive
        env:
          OPENNEKO_WEB_DIST: ${{ runner.temp }}/web
        run: |
          bash scripts/build-native-release.sh "${{ github.event.inputs.tag || github.event.release.tag_name }}" dist-native "${{ matrix.os }}/${{ matrix.arch }}"
          mv dist-native/checksums-native.txt "dist-native/checksums-${{ matrix.os }}_${{ matrix.arch }}.part"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-native
          if-no-files-found: error
          retention-days: 1

  native-archives:
    name: native archives
    runs-on: ubuntu-22.04
    needs: [goreleaser, native-build]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - uses: actions/download-artifact@v8
        with:
          path: dist-native
          pattern: native-*-*
          merge-multiple: true

      - name: Join the checksums
        run: |
          set -euo pipefail
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            cat "dist-native/checksums-${target}.part"
          done > dist-native/checksums-native.txt
          rm dist-native/checksums-*.part
          test "$(wc -l < dist-native/checksums-native.txt)" -eq 6
          cat dist-native/checksums-native.txt

      - name: Upload the native archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.inputs.tag || github.event.release.tag_name }}" dist-native/* --clobber

      - id: tap-token
        if: ${{ !contains(github.event.inputs.tag || github.event.release.tag_name, '-') }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: open-neko
          repositories: homebrew-tap

      - name: Publish the Homebrew cask
        if: ${{ !contains(github.event.inputs.tag || github.event.release.tag_name, '-') }}
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/open-neko/homebrew-tap.git" tap
          bash scripts/write-brew-cask.sh "$TAG" dist-native/checksums-native.txt > tap/Casks/openneko.rb
          cd tap
          git config user.name "openneko-release"
          git config user.email "openneko-release@users.noreply.github.com"
          git add Casks/openneko.rb
          git diff --cached --quiet || git commit -m "openneko ${TAG}"
          git push origin HEAD
