name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lazy-service:
    name: Lazy service lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: false
      - run: go test -race ./...
        working-directory: recipes/lazy-service

  sandbox:
    name: Sandbox recipe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: false
      - run: go vet ./... && go test -race ./...
        working-directory: recipes/sandbox
      - name: Test the sandbox skills in the image
        working-directory: recipes/sandbox
        run: |
          set -euo pipefail
          docker build --target skill-test -t openneko-sandbox:skill-test .
          docker run --rm openneko-sandbox:skill-test | tee /tmp/skill-test.log
          if ! grep -qx 'ℹ skipped 0' /tmp/skill-test.log; then
            echo "a skill test skipped; this step must run every one" >&2
            exit 1
          fi
      - name: Run the user-switching and ACL tests as root
        working-directory: recipes/sandbox
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -c -o /tmp/sandbox.test .
          docker run --rm --init --tmpfs /tmp:exec,mode=1777 -v /tmp/sandbox.test:/sandbox.test:ro \
            debian:bookworm-slim /sandbox.test -test.v -test.skip '^(TestDialHelper|TestEgressProof)$' | tee /tmp/sandbox-root.log
          if grep -- '--- SKIP' /tmp/sandbox-root.log; then
            echo "a root test skipped; this step must run every one" >&2
            exit 1
          fi
      - name: Prove the egress controls with real containers
        working-directory: recipes/sandbox
        env:
          OPENNEKO_EGRESS_PROOF_IMAGE: openneko-sandbox:proof
          OPENNEKO_EGRESS_PROOF_REQUIRED: "1"
          OPENNEKO_EGRESS_PROOF_HOST_PORT: "39187"
        run: |
          set -euo pipefail
          docker build -t openneko-sandbox:proof .
          docker pull -q pgvector/pgvector:0.8.6-pg16
          go test -count=1 -run '^TestEgressProof$' -v -timeout 20m . | tee /tmp/egress-proof.log
          if grep -- '--- SKIP' /tmp/egress-proof.log; then
            echo "the egress proof skipped; it must run" >&2
            exit 1
          fi

  release-recovery-contract:
    name: Release recovery contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify failed-to-recovered release transitions
        run: bash scripts/check-release-recovery-contract.sh

  trust-floors:
    name: Runtime and CA bundle floors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify runtimes and CA bundles carry the eMudhra fixes
        run: bash scripts/check-trust-floors.sh

  design-system:
    name: Web design system
    runs-on: ubuntu-24.04

    # Solo-mode pages resolve a persisted identity, just like installed instances.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neko
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: neko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENNEKO_PG_ENV_OVERRIDE: "1"
      NEKO_PG_HOST: 127.0.0.1
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: secret
      NEKO_PG_DATABASE: neko
      NEKO_PG_SSLMODE: disable

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce shared UI controls and tokens
        env:
          UI_SYSTEM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-web-design-system.mjs

      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install
        run: AX_SKIP_SKILL_INSTALL=1 pnpm install --frozen-lockfile

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/openneko/go.mod
          cache: false
      - uses: ./.github/actions/go-cache

      - name: Migrate visual-test database
        working-directory: apps/openneko
        run: go run ./cmd/openneko migrate

      - name: Install Chromium
        run: pnpm --filter @neko/web exec playwright install --with-deps chromium

      - name: Verify shared UI layouts, overlays and Magento rendering
        run: pnpm --filter @neko/web test:visual:design

      - name: Upload design-system browser results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magento-design-system-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: error

  graphjin-integration:
    name: GraphJin integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GRAPHJIN_VERSION: "3.21.18"
      GRAPHJIN_IMAGE: openneko/graphjin-integration:3.21.18

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install
        run: AX_SKIP_SKILL_INSTALL=1 pnpm install --frozen-lockfile

      - name: Build the pinned GraphJin runtime
        run: |
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --target graphjin-runtime \
            --tag "$GRAPHJIN_IMAGE" \
            .
          docker run --rm --entrypoint graphjin "$GRAPHJIN_IMAGE" version | grep -F "$GRAPHJIN_VERSION"

      - name: Validate shipped source-mode configs
        run: |
          for config in customer.sources.example.yml dev.sources.example.yml; do
            docker run --rm --entrypoint graphjin \
              --volume "$PWD/db/graphjin:/config:ro" \
              "$GRAPHJIN_IMAGE" \
              config --file "/config/$config" validate
          done

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neko
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: neko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: false
      - uses: ./.github/actions/go-cache

      - name: Install
        run: AX_SKIP_SKILL_INSTALL=1 pnpm install --frozen-lockfile

      - name: Install graphjin CLI
        env:
          GRAPHJIN_VERSION: "3.21.18"
        run: |
          curl -fsSL -o /tmp/graphjin.tgz \
            "https://github.com/dosco/graphjin/releases/download/v${GRAPHJIN_VERSION}/graphjin_${GRAPHJIN_VERSION}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/graphjin.tgz -C /usr/local/bin graphjin
          graphjin version


      - name: Run migrations
        env:
          NEKO_PG_HOST: localhost
          NEKO_PG_PORT: "5432"
          NEKO_PG_USER: neko
          NEKO_PG_PASSWORD: secret
          NEKO_PG_DATABASE: neko
        working-directory: apps/openneko
        run: go run ./cmd/openneko migrate

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Verify eval definitions and checked-in results
        run: |
          pnpm --filter @neko/evals schemas:generate
          pnpm --filter @neko/evals semantics:generate
          git diff --exit-code -- evals/schemas evals/semantics.yaml
          pnpm --filter @neko/evals repo:check

      - name: Build
        run: pnpm -r build

      - name: Build the static web app
        run: pnpm --filter @neko/web build:spa

      - name: Test
        env:
          LIBRARY_BROWSE_REQUIRE_DB: "1"
          NEKO_PG_HOST: localhost
          NEKO_PG_PORT: "5432"
          NEKO_PG_USER: neko
          NEKO_PG_PASSWORD: secret
          NEKO_PG_DATABASE: neko
          AGENT_AUTO_MEMORY: "off"
        run: pnpm -r --workspace-concurrency=1 test
