name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  librarian-image:
    name: Librarian image
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Run owned API contract tests
        run: docker build --target librarian-test -f apps/librarian/Dockerfile .

      - name: Build image with vendored models
        run: docker build --target librarian -t openneko-librarian:pr -f apps/librarian/Dockerfile .

      - name: Prove offline readiness and model presence
        run: |
          set -euo pipefail
          docker run -d --name neko-librarian-pr --network none openneko-librarian:pr
          trap 'docker rm -f neko-librarian-pr >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec neko-librarian-pr python -c \
              "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:5001/health/ready')); assert data['ok'] and data['ocr'] is False"; then
              break
            fi
            test "$attempt" != 30
            sleep 2
          done
          docker exec neko-librarian-pr python -c \
            "from pathlib import Path; root=Path('/opt/docling/models'); assert any(root.rglob('*'))"
          docker exec -i neko-librarian-pr python - <<'PY'
          from pathlib import Path
          from app import _convert

          phrase = "OpenNeko offline vendored model smoke"
          stream = f"BT /F1 16 Tf 72 720 Td ({phrase}) Tj ET".encode()
          objects = [
              b"<< /Type /Catalog /Pages 2 0 R >>",
              b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>",
              b"<< /Length %d >>\nstream\n" % len(stream) + stream + b"\nendstream",
              b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
          ]
          pdf = bytearray(b"%PDF-1.4\n")
          offsets = []
          for number, body in enumerate(objects, 1):
              offsets.append(len(pdf))
              pdf.extend(f"{number} 0 obj\n".encode() + body + b"\nendobj\n")
          xref = len(pdf)
          pdf.extend(f"xref\n0 {len(objects) + 1}\n0000000000 65535 f \n".encode())
          for offset in offsets:
              pdf.extend(f"{offset:010d} 00000 n \n".encode())
          pdf.extend(f"trailer\n<< /Size {len(objects) + 1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n".encode())
          source = Path("/tmp/offline-smoke.pdf")
          source.write_bytes(pdf)
          assert phrase in _convert(source)
          PY

  release-recovery-contract:
    name: Release recovery contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify failed-to-recovered release transitions
        run: bash scripts/check-release-recovery-contract.sh

  design-system:
    name: Web design system
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce shared UI controls and tokens
        env:
          UI_SYSTEM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-web-design-system.mjs

      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: AX_SKIP_SKILL_INSTALL=1 pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @neko/web exec playwright install --with-deps chromium

      - name: Verify Magento design-system rendering
        run: pnpm --filter @neko/web test:visual:design

      - name: Upload Magento design-system renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magento-design-system-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: error

  records-recovery:
    name: Records recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Verify backup and database crash recovery
        run: ./scripts/test-records-recovery.sh

  graphjin-integration:
    name: GraphJin integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      records-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: records
          POSTGRES_PASSWORD: records-secret
          POSTGRES_DB: records
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U records"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GRAPHJIN_VERSION: "3.20.47"
      RECORDS_GRAPHJIN_IMAGE: openneko/graphjin-integration:3.20.47
      REQUIRE_GRAPHJIN_INTEGRATION: "1"
      OPENNEKO_PG_ENV_OVERRIDE: "1"
      RECORDS_PG_HOST: localhost
      RECORDS_PG_PORT: "5434"
      RECORDS_PG_USER: records
      RECORDS_PG_PASSWORD: records-secret
      RECORDS_PG_DATABASE: records

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: AX_SKIP_SKILL_INSTALL=1 pnpm install --frozen-lockfile

      - name: Build the pinned GraphJin runtime
        run: |
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --target graphjin-runtime \
            --tag "$RECORDS_GRAPHJIN_IMAGE" \
            .
          docker run --rm --entrypoint graphjin \
            "$RECORDS_GRAPHJIN_IMAGE" version | grep -F "$GRAPHJIN_VERSION"

      - name: Validate shipped source-mode configs
        run: |
          for config in customer.sources.example.yml dev.sources.example.yml; do
            docker run --rm --entrypoint graphjin \
              --volume "$PWD/db/graphjin:/config:ro" \
              "$RECORDS_GRAPHJIN_IMAGE" \
              config --file "/config/$config" validate
          done

      - name: Configure GraphJin-to-Postgres routing
        run: |
          gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          test -n "$gateway"
          echo "RECORDS_GRAPHJIN_DB_HOST=$gateway" >> "$GITHUB_ENV"

      - name: Run live GraphJin compatibility tests
        run: |
          pnpm --filter @neko/records exec vitest run \
            test/policy-graphjin.integration.test.ts \
            test/schema-graphjin.integration.test.ts \
            test/write-executor.integration.test.ts \
            test/import-executor.integration.test.ts \
            --no-file-parallelism

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neko
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: neko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: apps/openneko/go.sum

      - name: Install
        run: AX_SKIP_SKILL_INSTALL=1 pnpm install --frozen-lockfile

      - name: Verify Hermes-only agent backend contract
        run: bash scripts/check-hermes-only.sh

      - name: Install graphjin CLI
        env:
          GRAPHJIN_VERSION: "3.20.47"
        run: |
          curl -fsSL -o /tmp/graphjin.tgz \
            "https://github.com/dosco/graphjin/releases/download/v${GRAPHJIN_VERSION}/graphjin_${GRAPHJIN_VERSION}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/graphjin.tgz -C /usr/local/bin graphjin
          graphjin version


      - name: Run migrations
        env:
          NEKO_PG_HOST: localhost
          NEKO_PG_PORT: "5432"
          NEKO_PG_USER: neko
          NEKO_PG_PASSWORD: secret
          NEKO_PG_DATABASE: neko
        working-directory: apps/openneko
        run: go run ./cmd/openneko migrate

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Verify eval definitions and checked-in results
        run: |
          pnpm --filter @neko/evals schemas:generate
          pnpm --filter @neko/evals semantics:generate
          git diff --exit-code -- evals/schemas evals/semantics.yaml
          pnpm --filter @neko/evals repo:check

      - name: Build
        run: pnpm -r build

      - name: Test
        env:
          NEKO_PG_HOST: localhost
          NEKO_PG_PORT: "5432"
          NEKO_PG_USER: neko
          NEKO_PG_PASSWORD: secret
          NEKO_PG_DATABASE: neko
          AGENT_AUTO_MEMORY: "off"
        # apps/web and apps/worker share Postgres; worker's reconciler scans processing_job globally and races with web's onboarding tests.
        run: pnpm -r --workspace-concurrency=1 test
