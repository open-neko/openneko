name: ax-harness (go)

on:
  push:
    branches: [main]
    paths:
      - "apps/ax-harness/**"
      - "packages/**"
      - "apps/web/**"
      - ".github/workflows/ax-harness.yml"
      - ".github/actions/go-cache/**"
  pull_request:
    paths:
      - "apps/ax-harness/**"
      - "packages/**"
      - "apps/web/**"
      - ".github/workflows/ax-harness.yml"
      - ".github/actions/go-cache/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/ax-harness
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/ax-harness/go.mod
          cache: false
      - uses: ./.github/actions/go-cache

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean; run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 -timeout 10m ./...
