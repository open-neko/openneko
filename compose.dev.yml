# Development backing services. Web and worker run on the host with hot
# reload (`pnpm dev`); `pnpm dev:up` starts these services with compose.yml
# and compose.adventureworks.yml, in sources mode.
#
# Every service a host process calls publishes a loopback port, and GraphJin
# config directories live on the host so the worker manages them.
services:
  graphjin-config-init:
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/graphjin:/config
      - ./db/graphjin/dev.sources.example.yml:/seed/agentic.yml:ro
      - ./scripts/graphjin-supervisor.sh:/seed/graphjin-supervisor.sh:ro
    entrypoint: !override
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -f /config/agentic.yml ]; then
          cp /seed/agentic.yml /config/agentic.yml
          KEY=$$(head -c 32 /dev/urandom | base64 | tr -d '\n')
          sed -i "s|REPLACE_WITH_BASE64_32_BYTE_KEY|$$KEY|" /config/agentic.yml
        fi
        cp /seed/graphjin-supervisor.sh /config/.openneko-graphjin-supervisor.sh.tmp
        chmod 0755 /config/.openneko-graphjin-supervisor.sh.tmp
        mv /config/.openneko-graphjin-supervisor.sh.tmp /config/.openneko-graphjin-supervisor.sh
        chown -R 1001:999 /config 2>/dev/null || true
        find /config -type d -exec chmod 0700 {} +
        find /config -type f -exec chmod 0600 {} +
        chmod 0700 /config/.openneko-graphjin-supervisor.sh

  # scripts/dev-up.sh writes the JWT secret from source before GraphJin
  # starts, so GraphJin does not wait on the worker-image secret init.
  graphjin:
    depends_on: !override
      graphjin-config-init:
        condition: service_completed_successfully
      adventureworks-init:
        condition: service_completed_successfully
    environment: !override
      GO_ENV: agentic
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/graphjin:/config
