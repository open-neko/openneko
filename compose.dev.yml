# Development backing services. Web and worker run on the host with hot
# reload (`pnpm dev`); `pnpm dev:up` starts these services with compose.yml
# and compose.adventureworks.yml, in sources mode.
#
# Every service a host process calls publishes a loopback port, and GraphJin
# config directories live on the host so the worker manages them.
services:
  openneko-serve-init:
    environment:
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      OPENNEKO_GRAPHJIN_SEED: /seed/dev.sources.yml
    volumes: !override
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko
      - openneko-serve-credentials:/credentials
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/graphjin:/config/graphjin

  # scripts/dev-up.sh runs openneko-serve-init before it starts serve.
  openneko-serve:
    depends_on: !override
      neko-db:
        condition: service_healthy
      adventureworks-init:
        condition: service_completed_successfully
    environment: !override
      OPENNEKO_SERVE_CREDENTIALS: /credentials
      OPENNEKO_SERVE_ADDR: 0.0.0.0:8090
      OPENNEKO_FILES_DIR: /data/files
      OPENNEKO_FILES_INDEX_DIR: /data/file-index
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      OPENNEKO_CONFIG_CHECK_SOCKET: /run/openneko/config-check.sock
      OPENNEKO_SANDBOX_URL: ${OPENNEKO_SANDBOX_URL:-}
      OPENNEKO_SANDBOX_KEY: ${OPENNEKO_SANDBOX_KEY:-}
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      OPENNEKO_GRAPHJIN_ADDR: 0.0.0.0:8080
    volumes: !override
      - openneko-agent-runs:/var/lib/openneko/agent-runs
      - openneko-run:/run/openneko
      - openneko-serve-credentials:/credentials:ro
      - openneko-files:/data
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/graphjin:/config/graphjin
      - ./:/workspace:ro
      - adventureworks-cache:/cache
