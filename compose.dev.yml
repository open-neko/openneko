# Development backing services. Web and worker run on the host with hot
# reload (`pnpm dev`); `pnpm dev:up` starts these services with compose.yml,
# compose.openshell.yml, compose.adventureworks.yml and
# compose.graphjin-agent.yml (sources-mode customer GraphJin).
#
# Every service a host process calls publishes a loopback port, and GraphJin
# config directories live on the host so the worker manages them.
services:
  embedding:
    ports:
      - "127.0.0.1:${OPENNEKO_EMBEDDING_PORT:-5003}:5003"

  librarian:
    ports:
      - "127.0.0.1:${OPENNEKO_LIBRARIAN_PORT:-5001}:5001"

  records-graphjin-config-init:
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/records-graphjin:/config

  records-graphjin:
    ports:
      - "127.0.0.1:${OPENNEKO_RECORDS_GRAPHJIN_PORT:-8090}:8090"
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/records-graphjin:/config:ro

  records-watch-graphjin:
    ports:
      - "127.0.0.1:${OPENNEKO_RECORDS_WATCH_GRAPHJIN_PORT:-8091}:8090"
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/records-graphjin:/config:ro

  graphjin-config-init:
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/graphjin:/config
      - ./db/graphjin/dev.sources.example.yml:/seed/agentic.yml:ro
      - ./scripts/graphjin-supervisor.sh:/seed/graphjin-supervisor.sh:ro

  # scripts/dev-up.sh writes the JWT secret from source before GraphJin
  # starts, so GraphJin does not wait on the worker-image secret init.
  graphjin:
    depends_on: !override
      graphjin-config-init:
        condition: service_completed_successfully
      adventureworks-init:
        condition: service_completed_successfully
    environment: !override
      GO_ENV: agentic
      GRAPHJIN_AGENT_API_KEY: ${GRAPHJIN_AGENT_API_KEY:-}
      GJ_AGENT_PROVIDER: ${GRAPHJIN_AGENT_PROVIDER:-google-gemini}
      GJ_AGENT_MODEL: ${GRAPHJIN_AGENT_MODEL:-gemini-3.5-flash}
      GJ_AGENT_BASE_URL: ${GRAPHJIN_AGENT_BASE_URL:-}
    volumes: !override
      - ${OPENNEKO_DEV_STATE:-./.openneko/dev}/graphjin:/config
