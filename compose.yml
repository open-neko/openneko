x-neko-app-env: &neko-app-env
  HOME: /tmp/openneko-home
  TMPDIR: /tmp/openneko-tmp
  XDG_CONFIG_HOME: /config
  XDG_CACHE_HOME: /tmp/openneko-home/.cache
  XDG_DATA_HOME: /tmp/openneko-home/.local/share
  XDG_STATE_HOME: /tmp/openneko-home/.local/state
  NEKO_PG_HOST: neko-db
  NEKO_PG_PORT: "5432"
  NEKO_PG_USER: neko
  NEKO_PG_PASSWORD: secret
  NEKO_PG_DATABASE: neko
  OPENNEKO_SERVE_URL: http://openneko-serve:8090
  NEKO_EMBEDDING_URL: ${NEKO_EMBEDDING_URL:-}
  NEKO_EMBEDDING_MODEL: ${NEKO_EMBEDDING_MODEL:-}
  NEKO_EMBEDDING_API_KEY: ${NEKO_EMBEDDING_API_KEY:-}
  NEKO_EMBEDDING_DIMENSIONS: ${NEKO_EMBEDDING_DIMENSIONS:-}
  NO_PROXY: localhost,127.0.0.1,::1,neko-db,worker,web,neko-graphjin,graphjin,openneko-serve,adventureworks-db,host.docker.internal,host.internal
  no_proxy: localhost,127.0.0.1,::1,neko-db,worker,web,neko-graphjin,graphjin,openneko-serve,adventureworks-db,host.docker.internal,host.internal

services:
  neko-db:
    # pgvector image: base postgres:16 with the vector extension preinstalled.
    build:
      context: .
      target: neko-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neko
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: neko
      PGDATA: /var/lib/postgresql/neko
    ports:
      - "127.0.0.1:${OPENNEKO_DB_PORT:-5432}:5432"
    volumes:
      - neko-db-data:/var/lib/postgresql/neko
      - neko-db-socket:/var/run/postgresql
    command:
      - postgres
      - -c
      - wal_compression=on
      - -c
      - temp_file_limit=5GB
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U neko -d neko
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot storage ABI gate. It repairs persisted indexes in the managed
  # database after a libc/collation-runtime transition and records the
  # enforced contract independently of schema migrations. Every database
  # consumer waits for successful completion, so an incompatible image fails
  # closed before application reads or writes begin.
  storage-reconcile:
    build:
      context: .
      target: neko-cli
    restart: "no"
    command: ["storage", "reconcile"]
    depends_on:
      neko-db:
        condition: service_healthy
    environment:
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
      XDG_CONFIG_HOME: /config
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko






  # Customer-data GraphJin. This is the endpoint stored per organization and
  # configured to point at the customer's existing databases/APIs. A fresh
  # production install starts with only GraphJin's governed config plane; the
  # demo overlay adds AdventureWorks as its initial data source.
  graphjin-config-init:
    image: alpine:3.20
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -f /config/agentic.yml ]; then
          cp /seed/customer.sources.yml /config/agentic.yml
          KEY=$$(head -c 32 /dev/urandom | base64 | tr -d '\n')
          sed -i "s|REPLACE_WITH_BASE64_32_BYTE_KEY|$$KEY|" /config/agentic.yml
        fi
        cp /seed/graphjin-supervisor.sh /config/.openneko-graphjin-supervisor.sh.tmp
        chmod 0755 /config/.openneko-graphjin-supervisor.sh.tmp
        mv /config/.openneko-graphjin-supervisor.sh.tmp /config/.openneko-graphjin-supervisor.sh
        chown -R 1001:999 /config 2>/dev/null || true
        find /config -type d -exec chmod 0700 {} +
        find /config -type f -exec chmod 0600 {} +
        chmod 0700 /config/.openneko-graphjin-supervisor.sh
    volumes:
      - openneko-graphjin-cli:/config
      - ./db/graphjin/customer.sources.example.yml:/seed/customer.sources.yml:ro
      - ./scripts/graphjin-supervisor.sh:/seed/graphjin-supervisor.sh:ro
    restart: "no"

  # One-shot: resolves (or creates, under an advisory lock) the single org
  # row and reconciles the per-org JWT secret into the customer GraphJin
  # sources config BEFORE the server's first start. GraphJin 3.18 does not
  # hot-reload auth keys; expressing that as `graphjin -> worker` cycled
  # against the adventureworks overlay's `worker -> graphjin` edge, so this
  # one-shot carries the ordering instead. Reconciles unconditionally, so
  # key rotation, restores, and partial volume wipes self-heal on the next
  # stack start.
  graphjin-secret-init:
    build:
      context: .
      target: worker
    working_dir: /app
    # Guarded for supervisor/image version skew: the main-supervisor deploy
    # path pairs a supervisor (and this embedded compose) built from main
    # with application images from the latest smoked RELEASE, which may
    # predate the init script. Older images fall back to the worker's
    # boot-time reconcile — the pre-secret-init behavior every released
    # worker still carries — instead of failing the whole bring-up.
    command:
      - /bin/sh
      - -c
      - |
        SCRIPT=node_modules/@neko/llm/src/graphjin/init-secret.mjs
        if [ -f "$$SCRIPT" ]; then
          exec node --import tsx/esm "$$SCRIPT"
        fi
        echo "[graphjin-secret-init] image predates the embedded secret-init script; the worker reconciles the per-org JWT secret at boot instead"
    depends_on:
      neko-migrate:
        condition: service_completed_successfully
      openneko-config-init:
        condition: service_completed_successfully
      graphjin-config-init:
        condition: service_completed_successfully
    environment:
      <<: *neko-app-env
      GRAPHJIN_SOURCES_CONFIG: /config/graphjin/agentic.yml
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
    restart: "no"

  graphjin:
    # Released installs use the matching released image in the embedded
    # Compose file; this source Compose file must exercise the current pin.
    build:
      context: .
      target: neko-graphjin
    user: "1001:999"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -x /usr/local/bin/openneko-graphjin-supervisor.sh ]; then
          exec /usr/local/bin/openneko-graphjin-supervisor.sh "$$@"
        fi
        exec /bin/sh /config/.openneko-graphjin-supervisor.sh "$$@"
      - --
    restart: unless-stopped
    depends_on:
      graphjin-config-init:
        condition: service_completed_successfully
      # The per-org JWT secret is reconciled into agentic.yml by the
      # graphjin-secret-init one-shot. GraphJin 3.18 does not hot-reload
      # auth keys, so start only after that reconciliation has completed.
      graphjin-secret-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${GRAPHJIN_PORT:-8080}:8080"
    environment:
      GO_ENV: agentic
      GRAPHJIN_AGENT_API_KEY: ${GRAPHJIN_AGENT_API_KEY:-}
      GJ_AGENT_PROVIDER: ${GRAPHJIN_AGENT_PROVIDER:-openai}
      GJ_AGENT_MODEL: ${GRAPHJIN_AGENT_MODEL:-gpt-4.1-mini}
    volumes:
      - openneko-graphjin-cli:/config
    command: ["serve", "--path", "/config"]
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:8080/api/v1/graphql"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot: applies SQL migrations to neko-db after both database volumes
  # satisfy the enforced storage contract. Every long-running service depends
  # on this completing successfully, so schema and storage are ready together.
  neko-migrate:
    build:
      context: .
      target: neko-cli
    restart: "no"
    command: ["migrate"]
    depends_on:
      neko-db:
        condition: service_healthy
      storage-reconcile:
        condition: service_completed_successfully
    # NEKO_PG_PASSWORD here is the bootstrap fallback only — once /setup
    # rotates the password the openneko CLI's defaultConn reads it from
    # /config/openneko/config.json on the shared volume. Without this volume
    # mount, re-`compose up` after rotation would fail with stale creds.
    environment:
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
      OPENNEKO_SKIP_MIGRATE: ${OPENNEKO_SKIP_MIGRATE:-}
      XDG_CONFIG_HOME: /config
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko

  # The migration CLI runs as root and may create the shared config directory
  # and secret key on first boot. Repair ownership before the non-root worker
  # mounts the volume so a completely fresh Compose project can start.
  openneko-config-init:
    image: alpine:3.22
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /config/openneko
        chown -R 1001:1001 /config/openneko
        chmod 0700 /config/openneko
    depends_on:
      neko-migrate:
        condition: service_completed_successfully
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko
    restart: "no"

  neko-graphjin:
    build:
      context: .
      target: neko-graphjin
    restart: unless-stopped
    depends_on:
      # neko-db must be reachable for graphjin to connect; neko-migrate must
      # have finished so graphjin's schema cache reflects all pending
      # migrations. db_schema_poll_duration: 10s in neko.yml also picks up
      # post-boot migrations, but the explicit dep keeps first-boot
      # deterministic.
      neko-db:
        condition: service_healthy
      neko-migrate:
        condition: service_completed_successfully
    # The custom entrypoint reads the password from /openneko-config/config.json
    # (written by the worker entrypoint + the /setup wizard) on every container
    # start, so password rotation works after a simple `docker compose restart
    # neko-graphjin`. NEKO_PG_PASSWORD here is the bootstrap fallback used the
    # very first time, before config.json exists.
    #
    # OPENNEKO_CONFIG_VOLUME selects the source of /openneko-config. Default is
    # the named volume `openneko-config`, shared with web+worker when they too
    # run in compose. In host-hybrid dev (`pnpm dev:up`), it's overridden to the
    # operator's `$HOME/.config/openneko` so host web/worker and in-Docker
    # graphjin share the same physical config.json without a manual sync.
    environment:
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/openneko-config:ro
    ports:
      - "127.0.0.1:${OPENNEKO_GRAPHJIN_PORT:-8089}:8089"
    healthcheck:
      # graphjin serves no /health route (it 500s); the GraphQL endpoint
      # answering is the honest readiness signal.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8089/api/v1/graphql"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot: sets the neko_files role password and writes serve's
  # credentials. Serve holds no main database login and no secret-key.
  openneko-serve-init:
    build:
      context: .
      target: neko-serve
    command: ["serve-init", "--dir", "/credentials"]
    depends_on:
      neko-migrate:
        condition: service_completed_successfully
      openneko-config-init:
        condition: service_completed_successfully
    environment:
      NEKO_PG_HOST: neko-db
      NEKO_PG_PORT: "5432"
      NEKO_PG_USER: neko
      NEKO_PG_PASSWORD: ${NEKO_PG_PASSWORD:-secret}
      NEKO_PG_DATABASE: neko
      XDG_CONFIG_HOME: /config
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko
      - openneko-serve-credentials:/credentials
    restart: "no"

  # openneko serve: each user's private files, their keyword index in
  # neko-db, SQL over sheet tables and agent turns. Web and worker call it
  # with short-lived tokens signed with a key derived from the secret-key.
  openneko-serve:
    build:
      context: .
      target: neko-serve
    command: ["serve"]
    depends_on:
      openneko-serve-init:
        condition: service_completed_successfully
    environment:
      OPENNEKO_SERVE_CREDENTIALS: /credentials
      OPENNEKO_SERVE_ADDR: 0.0.0.0:8090
      OPENNEKO_FILES_DIR: /data/files
      OPENNEKO_FILES_INDEX_DIR: /data/file-index
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      OPENNEKO_SANDBOX_URL: ${OPENNEKO_SANDBOX_URL:-}
      OPENNEKO_SANDBOX_KEY: ${OPENNEKO_SANDBOX_KEY:-}
    volumes:
      - openneko-agent-runs:/var/lib/openneko/agent-runs
      - openneko-run:/run/openneko
      - openneko-serve-credentials:/credentials:ro
      - openneko-files:/data
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      openneko-serve:
        condition: service_started
      # Schema is guaranteed ready by neko-migrate before web boots.
      neko-migrate:
        condition: service_completed_successfully
      neko-graphjin:
        condition: service_started
      graphjin:
        condition: service_started
      graphjin-secret-init:
        condition: service_completed_successfully
      # Web is the user-facing readiness boundary. Do not serve the temporary
      # recovery screen while the control plane is still starting.
      worker:
        condition: service_healthy
    environment:
      <<: *neko-app-env
      WORKER_ADMIN_URL: http://worker:4100
      OPENNEKO_RESTART_WEB_ON_PASSWORD_CHANGE: "1"
      # Base URL for emailed sign-in links and OAuth callbacks. Set it to the
      # URL people open when the web port is behind a proxy or another host.
      OPENNEKO_PUBLIC_URL: ${OPENNEKO_PUBLIC_URL:-http://localhost:${OPENNEKO_PORT:-3000}}
      OPENNEKO_MAP_STYLE: ${OPENNEKO_MAP_STYLE:-}
      OPENNEKO_GRAPHJIN_URL: http://neko-graphjin:8089
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      OPENNEKO_SANDBOX_URL: ${OPENNEKO_SANDBOX_URL:-}
      OPENNEKO_SANDBOX_KEY: ${OPENNEKO_SANDBOX_KEY:-}
      OPENNEKO_AGENT_RUNS_DIR: /var/lib/openneko/agent-runs
    ports:
      - "${OPENNEKO_WEB_BIND_ADDRESS:-0.0.0.0}:${OPENNEKO_PORT:-3000}:8080"
    volumes:
      # Honors OPENNEKO_CONFIG_VOLUME like neko-migrate/neko-graphjin, so the
      # host-hybrid dev layout shares one physical config dir (and one
      # secret-key) instead of splitting it across a named volume.
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
      - openneko-agent-runs:/var/lib/openneko/agent-runs
      - openneko-run:/run/openneko
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    depends_on:
      openneko-serve:
        condition: service_started
      # Schema is guaranteed ready by neko-migrate before worker boots.
      neko-migrate:
        condition: service_completed_successfully
      openneko-config-init:
        condition: service_completed_successfully
      # The per-org JWT secret is seeded by graphjin-secret-init before
      # either GraphJin or the worker starts; the worker's own boot pass is
      # a re-verify. Depending on the one-shots avoids a startup cycle.
      graphjin-config-init:
        condition: service_completed_successfully
      graphjin-secret-init:
        condition: service_completed_successfully
    environment:
      <<: *neko-app-env
      OPENNEKO_GRAPHJIN_URL: http://neko-graphjin:8089
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      OPENNEKO_SANDBOX_URL: ${OPENNEKO_SANDBOX_URL:-}
      OPENNEKO_SANDBOX_KEY: ${OPENNEKO_SANDBOX_KEY:-}
      OPENNEKO_AGENT_RUNS_DIR: /var/lib/openneko/agent-runs
    expose:
      - "4100"
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
      - openneko-agent-runs:/var/lib/openneko/agent-runs
      - openneko-run:/run/openneko
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  neko-db-data:
  neko-db-socket:
  openneko-config:
  openneko-files:
  openneko-serve-credentials:
  openneko-graphjin-cli:
  openneko-agent-home:
  openneko-agent-tmp:
  openneko-agent-runs:
  openneko-run:
