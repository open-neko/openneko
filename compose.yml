x-neko-app-env: &neko-app-env
  HOME: /tmp/openneko-home
  TMPDIR: /tmp/openneko-tmp
  XDG_CONFIG_HOME: /config
  XDG_CACHE_HOME: /tmp/openneko-home/.cache
  XDG_DATA_HOME: /tmp/openneko-home/.local/share
  XDG_STATE_HOME: /tmp/openneko-home/.local/state
  OPENNEKO_DATABASE_URL_FILE: /run/secrets/database-url
  OPENNEKO_SERVE_URL: http://openneko-serve:8090
  NEKO_EMBEDDING_URL: ${NEKO_EMBEDDING_URL:-}
  NEKO_EMBEDDING_MODEL: ${NEKO_EMBEDDING_MODEL:-}
  NEKO_EMBEDDING_API_KEY: ${NEKO_EMBEDDING_API_KEY:-}
  OPENNEKO_METRICS_REFRESH: ${OPENNEKO_METRICS_REFRESH:-off}
  NEKO_EMBEDDING_DIMENSIONS: ${NEKO_EMBEDDING_DIMENSIONS:-}
  NO_PROXY: localhost,127.0.0.1,::1,neko-db,worker,web,graphjin,openneko-serve,adventureworks-db,host.docker.internal,host.internal
  no_proxy: localhost,127.0.0.1,::1,neko-db,worker,web,graphjin,openneko-serve,adventureworks-db,host.docker.internal,host.internal

x-database-url: &database-url
  - source: database-url
    uid: "1001"
    gid: "1001"
    mode: 0400

services:
  # Start steps. Services in the "steps" profile are not part of `up`.
  # `openneko start`, `upgrade` and `restore` run them in this order with
  # `compose run --rm` and stop at the first failure. From a source checkout,
  # `docker compose run --rm openneko-serve-init` runs the whole chain.
  #
  # Checks an external database before the other steps: connection, TLS,
  # the vector extension and the rights to create the serve roles. It prints
  # the SQL an operator must run when a right is missing.
  database-check:
    profiles: ["steps"]
    build:
      context: .
      target: neko-cli
    restart: "no"
    command: ["database", "check"]
    secrets: *database-url
    environment:
      OPENNEKO_DATABASE_URL_FILE: /run/secrets/database-url
      XDG_CONFIG_HOME: /config
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko

  # Reports the collation state of the external database. The bundled
  # database overlay turns it into the storage ABI gate, which repairs.
  storage-reconcile:
    profiles: ["steps"]
    build:
      context: .
      target: neko-cli
    restart: "no"
    command: ["storage", "reconcile", "--report-only"]
    secrets: *database-url
    environment:
      OPENNEKO_DATABASE_URL_FILE: /run/secrets/database-url
      XDG_CONFIG_HOME: /config
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko

  # Applies SQL migrations after the storage gate.
  neko-migrate:
    profiles: ["steps"]
    build:
      context: .
      target: neko-cli
    restart: "no"
    command: ["migrate"]
    depends_on:
      storage-reconcile:
        condition: service_completed_successfully
    # With the bundled database, config.json on the config volume holds the
    # password that setup rotates.
    secrets: *database-url
    environment:
      OPENNEKO_DATABASE_URL_FILE: /run/secrets/database-url
      OPENNEKO_SKIP_MIGRATE: ${OPENNEKO_SKIP_MIGRATE:-}
      XDG_CONFIG_HOME: /config
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko

  # The migration CLI runs as root and may create the shared config directory
  # and secret key on first boot. Repair ownership before the non-root worker
  # mounts the volume so a completely fresh Compose project can start.
  openneko-config-init:
    profiles: ["steps"]
    image: alpine:3.22
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /config/openneko
        chown -R 1001:1001 /config/openneko
        chmod 0700 /config/openneko
    depends_on:
      neko-migrate:
        condition: service_completed_successfully
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko
    restart: "no"

  # Creates the serve roles of this database and sets their passwords,
  # writes serve's credentials
  # and creates the customer GraphJin config when it is missing. Serve holds
  # no main database login and no secret-key.
  openneko-serve-init:
    profiles: ["steps"]
    build:
      context: .
      target: neko-serve
    command: ["serve-init", "--dir", "/credentials"]
    depends_on:
      neko-migrate:
        condition: service_completed_successfully
      openneko-config-init:
        condition: service_completed_successfully
    secrets: *database-url
    environment:
      OPENNEKO_DATABASE_URL_FILE: /run/secrets/database-url
      XDG_CONFIG_HOME: /config
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko
      - openneko-serve-credentials:/credentials
      - openneko-graphjin-cli:/config/graphjin
    restart: "no"

  # openneko serve: each user's private files, their keyword index in
  # OpenNeko's database, SQL over sheet tables, agent turns, the customer GraphJin on
  # 8080 and the subscriptions GraphJin on 8089 (workflow outputs, read as
  # the subscriptions role).
  # Web and worker call it with short-lived tokens signed with a key derived
  # from the secret-key. GraphJin does not reload auth keys, so the start
  # steps write the per-org JWT secret before serve starts.
  openneko-serve:
    build:
      context: .
      target: neko-serve
    command: ["serve"]
    networks:
      default:
        aliases: [graphjin]
    ports:
      - "127.0.0.1:${GRAPHJIN_PORT:-8080}:8080"
      - "127.0.0.1:${OPENNEKO_GRAPHJIN_PORT:-8089}:8089"
    environment:
      OPENNEKO_SERVE_CREDENTIALS: /credentials
      OPENNEKO_SERVE_ADDR: 0.0.0.0:8090
      OPENNEKO_FILES_DIR: /data/files
      OPENNEKO_FILES_INDEX_DIR: /data/file-index
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      OPENNEKO_CONFIG_CHECK_SOCKET: /run/openneko/config-check.sock
      OPENNEKO_SANDBOX_URL: ${OPENNEKO_SANDBOX_URL:-}
      OPENNEKO_SANDBOX_KEY: ${OPENNEKO_SANDBOX_KEY:-}
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      OPENNEKO_GRAPHJIN_ADDR: 0.0.0.0:8080
      OPENNEKO_SUBSCRIPTIONS_ADDR: 0.0.0.0:8089
    volumes:
      - openneko-agent-runs:/var/lib/openneko/agent-runs
      - openneko-run:/run/openneko
      - openneko-serve-credentials:/credentials:ro
      - openneko-files:/data
      - openneko-graphjin-cli:/config/graphjin
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      openneko-serve:
        condition: service_started
      # Web is the user-facing readiness boundary. Do not serve the temporary
      # recovery screen while the control plane is still starting.
      worker:
        condition: service_healthy
    secrets: *database-url
    environment:
      <<: *neko-app-env
      WORKER_ADMIN_URL: unix:///run/openneko/worker.sock
      OPENNEKO_RESTART_WEB_ON_PASSWORD_CHANGE: "1"
      # Base URL for emailed sign-in links and OAuth callbacks. Set it to the
      # URL people open when the web port is behind a proxy or another host.
      OPENNEKO_PUBLIC_URL: ${OPENNEKO_PUBLIC_URL:-http://localhost:${OPENNEKO_PORT:-3000}}
      OPENNEKO_MAP_STYLE: ${OPENNEKO_MAP_STYLE:-}
      OPENNEKO_GRAPHJIN_URL: http://openneko-serve:8089
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      OPENNEKO_CONFIG_CHECK_SOCKET: /run/openneko/config-check.sock
      OPENNEKO_SANDBOX_URL: ${OPENNEKO_SANDBOX_URL:-}
      OPENNEKO_SANDBOX_KEY: ${OPENNEKO_SANDBOX_KEY:-}
      OPENNEKO_AGENT_RUNS_DIR: /var/lib/openneko/agent-runs
    ports:
      - "${OPENNEKO_WEB_BIND_ADDRESS:-0.0.0.0}:${OPENNEKO_PORT:-3000}:8080"
    volumes:
      # Honors OPENNEKO_CONFIG_VOLUME like neko-migrate, so the
      # host-hybrid dev layout shares one physical config dir (and one
      # secret-key) instead of splitting it across a named volume.
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
      - openneko-agent-runs:/var/lib/openneko/agent-runs
      - openneko-run:/run/openneko
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    depends_on:
      openneko-serve:
        condition: service_started
    secrets: *database-url
    environment:
      <<: *neko-app-env
      OPENNEKO_GRAPHJIN_URL: http://openneko-serve:8089
      OPENNEKO_GRAPHJIN_CONFIG: /config/graphjin/agentic.yml
      OPENNEKO_SERVE_SOCKET: /run/openneko/serve.sock
      OPENNEKO_CONFIG_CHECK_SOCKET: /run/openneko/config-check.sock
      OPENNEKO_SANDBOX_URL: ${OPENNEKO_SANDBOX_URL:-}
      OPENNEKO_SANDBOX_KEY: ${OPENNEKO_SANDBOX_KEY:-}
      OPENNEKO_AGENT_RUNS_DIR: /var/lib/openneko/agent-runs
      OPENNEKO_WORKER_SOCKET: /run/openneko/worker.sock
      WORKER_ADMIN_URL: unix:///run/openneko/worker.sock
    volumes:
      - ${OPENNEKO_CONFIG_VOLUME:-openneko-config}:/config/openneko
      - openneko-graphjin-cli:/config/graphjin
      - openneko-agent-home:/tmp/openneko-home
      - openneko-agent-tmp:/tmp/openneko-tmp
      - openneko-agent-runs:/var/lib/openneko/agent-runs
      - openneko-run:/run/openneko
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--unix-socket", "/run/openneko/worker.sock", "http://worker/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  openneko-config:
  openneko-files:
  openneko-serve-credentials:
  openneko-graphjin-cli:
  openneko-agent-home:
  openneko-agent-tmp:
  openneko-agent-runs:
  openneko-run:

secrets:
  database-url:
    environment: OPENNEKO_DATABASE_URL
