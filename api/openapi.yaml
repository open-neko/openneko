  /hooks/{workflowId}:
    post:
      operationId: postHooksByWorkflowId
      tags:
      - hooks
      summary: Start a workflow run from a webhook
      x-access: token
      security:
      - webhookToken: []
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: mode
        in: query
        required: false
        schema:
          type: string
        description: 'Execution mode: "single" or "batch"'
      - name: wait
        in: query
        required: false
        schema:
          type: string
        description: Set "true" or "1" to wait for the run to finish
      - name: wait_timeout
        in: query
        required: false
        schema:
          type: integer
        description: Seconds to wait when wait is set
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The run finished; the body is the result artifact (JSON or CSV)
          content:
            application/octet-stream: {}
        '202':
          description: The run is queued or running; poll the result URL
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                  runId:
                    type: string
                  status:
                    type: string
                  mode:
                    type: string
                  idempotentReplay:
                    type: boolean
                  note:
                    type: string
                  resultUrl:
                    type: string
                  resultRequest:
                    type: object
        '400':
          description: Invalid Idempotency-Key header, mode, JSON, or payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: The X-Webhook-Token header is missing or wrong
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Webhook not found, or the run has no artifact
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: Idempotency conflict, workflow disabled, ambiguous artifacts, or the run needs
            input or was aborted
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '413':
          description: The body is too large, or a batch array has too many records
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '422':
          description: Batch mode is not ready for this workflow
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '429':
          description: Rate limit, budget, or queue limit reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '502':
          description: The run failed or produced no batch result
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
