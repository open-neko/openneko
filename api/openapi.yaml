openapi: 3.1.0
info:
  title: OpenNeko API
  version: '1'
  description: 'Every route that the OpenNeko server answers. The server base is /api/v1. A request to
    /api/<path> from an older release reaches /api/v1/<path>, because identity providers, OAuth apps and
    webhooks still hold those URLs. x-access names the rule that the request gate applies: public, token,
    signed-in or admin.'
servers:
- url: /api/v1
tags:
- name: action-requests
- name: admin
- name: approvals
- name: auth
- name: bots
- name: hooks
- name: insights
- name: integrations
- name: library
- name: my
- name: observations
- name: onboarding
- name: pack-accounts
- name: policies
- name: profile
- name: settings
- name: sso
- name: subscriptions
- name: version
- name: work
- name: workflow-runs
- name: workflows
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: openneko_session
    deviceToken:
      type: http
      scheme: bearer
      description: A device token (onk_dev_...) for the installed app, from /auth/device/token. It works
        on every signed-in and admin route. An admin can revoke it; it also stops after 30 days without
        use or when the user is disabled.
    workflowApiKey:
      type: http
      scheme: bearer
      description: A workflow API key
    webhookToken:
      type: apiKey
      in: header
      name: X-Webhook-Token
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          oneOf:
          - type: string
          - type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
        code:
          type: string
    ModelPrice:
      type:
      - object
      - 'null'
      required:
      - inputUsdPer1M
      - outputUsdPer1M
      properties:
        inputUsdPer1M:
          type: number
        outputUsdPer1M:
          type: number
    ModelRecord:
      type: object
      required:
      - id
      - name
      - provider
      - model
      - enabled
      - config
      - secretStatus
      - price
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        model:
          type: string
        enabled:
          type: boolean
        config:
          type: object
        secretStatus:
          type: object
          description: Each stored key as a mask
          additionalProperties:
            type: string
        price:
          $ref: '#/components/schemas/ModelPrice'
    ExternalServiceStatus:
      type: object
      required:
      - id
      - label
      - state
      - where
      - detail
      - checkedAt
      additionalProperties: false
      properties:
        id:
          type: string
          enum:
          - inference
          - embedding
          - sandbox
          - file-store
        label:
          type: string
        state:
          type: string
          enum:
          - 'off'
          - ok
          - failing
        where:
          type:
          - string
          - 'null'
          description: The scheme and host of the service, or the bucket. Never a key or a path with credentials.
        detail:
          type: string
          description: What the check found, or what still works when the service is off
        checkedAt:
          type: string
          format: date-time
    ModelSettings:
      type: object
      required:
      - defaultModel
      - models
      - routes
      - catalog
      additionalProperties: false
      properties:
        defaultModel:
          type: object
          properties:
            provider:
              type: string
            model:
              type: string
            source:
              type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelRecord'
        routes:
          type: array
          items:
            type: object
            required:
            - task
            - label
            - description
            - modelId
            - fallbackModelId
            properties:
              task:
                type: string
              label:
                type: string
              description:
                type: string
              modelId:
                type:
                - string
                - 'null'
              fallbackModelId:
                type:
                - string
                - 'null'
        catalog:
          type: object
    ModelSaved:
      type: object
      required:
      - model
      - settings
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/ModelRecord'
        settings:
          $ref: '#/components/schemas/ModelSettings'
    ModelDraft:
      type: object
      properties:
        name:
          type: string
        provider:
          type: string
        model:
          type: string
        enabled:
          type: boolean
        config:
          type: object
        secrets:
          type: object
          description: A key set to null is removed
        price:
          $ref: '#/components/schemas/ModelPrice'
paths:
  /action-requests:
    get:
      operationId: getActionRequests
      tags:
      - action-requests
      summary: List the action requests
      x-access: signed-in
      security:
      - session: []
      - deviceToken: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Filter by status, e.g. pending_approval
      - name: workflowRunId
        in: query
        required: false
        schema:
          type: string
        description: Filter by workflow run
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Rows to return, 1 to 500, default 100
      responses:
        '200':
          description: The visible action requests
          content:
            application/json:
              schema:
                type: object
                required:
                - actionRequests
                additionalProperties: false
                properties:
                  actionRequests:
                    type: array
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /action-requests/{actionRequestId}:
    get:
      operationId: getActionRequestsByActionRequestId
      tags:
      - action-requests
      summary: Get one action request with its executions
      x-access: signed-in
      security:
      - session: []
      - deviceToken: []
      parameters:
      - name: actionRequestId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The action request and its context
          content:
            application/json:
              schema:
                type: object
                required:
                - actionRequest
                - executions
                - workflow
                - policy
                - upstreamOutput
                - approverKind
                - canRetry
                additionalProperties: false
                properties:
                  actionRequest:
                    type: object
                  executions:
                    type: array
                  workflow:
                    type: object
                  policy:
                    type:
                    - object
                    - 'null'
                  upstreamOutput:
                    type:
                    - object
                    - 'null'
                  approverKind:
                    type:
                    - string
                    - 'null'
                  canRetry:
                    type: boolean
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The action request is not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchActionRequestsByActionRequestId
      tags:
      - action-requests
      summary: Approve, reject, or retry an action request
      x-access: signed-in
      security:
      - session: []
      - deviceToken: []
      parameters:
      - name: actionRequestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  description: approve, reject, or retry
                reason:
                  type: string
                  description: Rejection reason
              required:
              - decision
      responses:
        '200':
          description: The new status of the action request
          content:
            application/json:
              schema:
                type: object
                required:
                - actionRequest
                additionalProperties: false
                properties:
                  actionRequest:
                    type: object
        '400':
          description: The decision is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The action request is not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The status change is not allowed or the retry is not safe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/change-password:
    get:
      operationId: getAdminChangePassword
      tags:
      - admin
      summary: Report whether the database password has changed
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      responses:
        '200':
          description: Password status
          content:
            application/json:
              schema:
                type: object
                required:
                - changed
                additionalProperties: false
                properties:
                  changed:
                    type: boolean
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      operationId: postAdminChangePassword
      tags:
      - admin
      summary: Change the local database password
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: New password, 8 characters or more
              required:
              - password
      responses:
        '200':
          description: The password changed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                  workerNotified:
                    type: boolean
        '400':
          description: The password is too short, too common, or has unsafe characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: The install connects with a database URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: The password change failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /admin/channels/settings:
    get:
      operationId: getAdminChannelsSettings
      tags:
      - admin
      summary: List the settings of each built-in channel
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      responses:
        '200':
          description: Worker response, passed through with the worker status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  channels:
                    type: array
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '502':
          description: The worker is not reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      operationId: postAdminChannelsSettings
      tags:
      - admin
      summary: Save the settings of one channel
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  description: Channel id
                values:
                  type: object
                  description: Setting key to a string, or null to clear. A channel is on while its required settings are set
                state:
                  type: string
                  enum:
                  - 'on'
                  - 'off'
                  description: on mints the settings OpenNeko generates; off removes every stored setting. Send values or state
              required:
              - channel
      responses:
        '200':
          description: Worker response, passed through with the worker status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
        '400':
          description: Unknown channel or setting, values and state together, or a required setting missing for on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '502':
          description: The worker is not reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /admin/context-remote:
    delete:
      operationId: deleteAdminContextRemote
      tags:
      - admin
      summary: Disconnect the remote context repository
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      responses:
        '200':
          description: The remote is removed
          content:
            application/json:
              schema:
                type: object
                required:
                - remote
                additionalProperties: false
                properties:
                  remote:
                    type: 'null'
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    get:
      operationId: getAdminContextRemote
      tags:
      - admin
      summary: Get the remote context repository settings
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      responses:
        '200':
          description: The remote settings, or null
          content:
            application/json:
              schema:
                type: object
                required:
                - remote
                additionalProperties: false
                properties:
                  remote:
                    type:
                    - object
                    - 'null'
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    put:
      operationId: putAdminContextRemote
      tags:
      - admin
      summary: Save the remote context repository settings
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                mode:
                  type: string
                branch:
                  type: string
                kinds:
                  type: array
                  description: Kinds of items to publish
                username:
                  type: string
                token:
                  type: string
                  description: New token; omit to keep, null to remove
                newSshKey:
                  type: boolean
                  description: Replace the SSH deploy key
              required:
              - url
              - mode
              - branch
              - kinds
      responses:
        '200':
          description: The saved remote
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  remote:
                    type: object
        '400':
          description: The body is missing or the settings are not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /admin/context-remote/host-key:
    post:
      operationId: postAdminContextRemoteHostKey
      tags:
      - admin
      summary: Confirm the SSH host key of the remote
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      responses:
        '200':
          description: The updated remote
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  remote:
                    type: object
        '400':
          description: The confirmation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /admin/context-remote/publish:
    get:
      operationId: getAdminContextRemotePublish
      tags:
      - admin
      summary: Preview what a publish sends to the remote
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
        description: Item kind; with name, returns one diff
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: Item name; with kind, returns one diff
      responses:
        '200':
          description: The changed items, or the diff of one item
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                  diff:
                    type: string
                  truncated:
                    type: boolean
        '400':
          description: The remote is not set or the item is not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      operationId: postAdminContextRemotePublish
      tags:
      - admin
      summary: Publish the organisation context to the remote
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      responses:
        '200':
          description: The publish result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                  remote:
                    type: object
        '400':
          description: The publish failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  remote:
                    type:
                    - object
                    - 'null'
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /admin/context-remote/updates:
    get:
      operationId: getAdminContextRemoteUpdates
      tags:
      - admin
      summary: List skills and packs that changed in the remote
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      parameters:
      - name: skill
        in: query
        required: false
        schema:
          type: string
        description: Skill name; returns the diff for that skill
      responses:
        '200':
          description: The updates, or the diff of one skill
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  updates:
                    type: object
                  diff:
                    type: string
                  truncated:
                    type: boolean
        '400':
          description: The remote is not set or the check failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      operationId: postAdminContextRemoteUpdates
      tags:
      - admin
      summary: Apply the chosen skill and pack updates
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                skills:
                  type: array
                  description: 'Items of {name, choice: remote|local}'
                packs:
                  type: array
                  description: Pack ids to add
      responses:
        '200':
          description: The applied updates
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  sha:
                    type: string
                  packs:
                    type: array
                  updates:
                    type: object
        '400':
          description: The update failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /admin/data-access:
    get:
      operationId: getAdminDataAccess
      tags:
      - admin
      summary: List the data access rules
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      parameters:
      - name: groupId
        in: query
        required: false
        schema:
          type: string
        description: Filter to one group
      responses:
        '200':
          description: The rules
          content:
            application/json:
              schema:
                type: object
                required:
                - rules
                - enabled
                additionalProperties: false
                properties:
                  rules:
                    type: array
                  enabled:
                    type: boolean
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      operationId: postAdminDataAccess
      tags:
      - admin
      summary: Create or update a data access rule
      x-access: admin
      security:
      - session: []
      - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupId:
                  type: string
                source:
                  type: string
                tableSchema:
                  type: string
                tableName:
                  type: string
                columns:
                  type: array
                  description: Column names
                rowFilter:
                  type: object
                  description: Optional row filter
              required:
              - groupId
              - source
              - tableName
              - columns
      responses:
        '201':
          description: The saved rule
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  rule:
                    type: object
        '400':
          description: A required field is missing, the row filter is not valid, or the input is not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
        '401':
          description: The session or device token is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: The group or item does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
